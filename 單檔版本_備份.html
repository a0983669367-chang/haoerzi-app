<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>康和「好日子」— 銀髮退休現金流管家</title>
<meta name="description" content="康和證券銀髮理財 App 原型：現金流月曆、三桶水資產配置、老本試算、防詐守門員、家庭共管。">

<meta name="theme-color" content="#0F4C75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="好日子">

<style>
/* ==========================================================================
   康和「好日子」App 樣式表
   --------------------------------------------------------------------------
   想改「顏色」→ 改下面第 1 區的 :root 變數，全站會一起變
   想改「字級」→ 搜尋 font-size
   想改「手機尺寸」→ 搜尋 .phone 的 width、.screen 的 height
   ========================================================================== */

/* ===== 1. 色彩與設計變數（改這裡就能換整套配色） ===== */
:root{
  /* ===== 主色調：灰、白、深藍 =====
     整體只用這三個色階，畫面才不會花。顏色只留給「有特殊意義」的東西
     （見下方的語意色）。 */
  --navy:#0F4C75;        /* 主色：主要按鈕、選中的頁籤／導覽、卡片色條 */
  --navy-dk:#0A3557;     /* 主色深階：hover、需要更深的時候 */
  --head:#0F4C75;        /* 標題、金額、重點數字（跟主色同一個藍，語意不同所以分開放） */

  --ink:#1F2A37;         /* 主要文字：深灰藍 */
  --ink-2:#5B6A7A;       /* 次要文字 */
  --line:#DDE2E8;        /* 卡片外框 */
  --line-2:#EDF0F3;      /* 更淡的分隔線（列與列之間） */
  --bg:#E9ECEF;          /* 頁面底色：灰 */
  --tint:#F3F5F7;        /* 手機螢幕底色、卡片內的淺色填充 */
  --tint-2:#E4E8EC;      /* 手機標題列的灰 */
  --track:#DDE2E8;       /* 滑桿與進度條的軌道 */
  --card:#FFFFFF;        /* 卡片：白 */

  /* ===== 語意色：只給「有特別意義」的東西用，不當裝飾 =====
     金 → ① 月曆的入帳金點，以及「把選定商品加進月曆」的模擬狀態
     綠 → 安全、適合您、每月可領的錢（正向）
     琥珀→ 警示、RR4、需加強評估
     酒紅→ 高風險、詐騙警告、RR5
     青 → 聯絡真人（撥電話、預約回電）
     品牌紅 → 只給吉祥物「小方」的領巾與鞋，跟官方角色一致；
              介面本身不再用紅色（logo 是圖檔，本來就保留原本的紅黑配色） */
  --gold:#E9A227;
  --gold-tx:#8A5510;
  --gold-lt:#FBF0DC;
  --green:#2E7D5B;
  --green-lt:#E4F2EA;
  --red:#7A2233;
  --red-lt:#FBE9E7;
  --teal:#1B7B8C;
  --brand-red:#DB190E;

  --radius:20px;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* 按下去會有一點點回饋（輕輕縮小一下），比死板的純色切換更有手感。
   幅度很小（4%）、時間很短，不是持續播放的動態效果，跟吉祥物的浮動動畫不同類，
   不受「減少動態效果」設定影響——原生 iOS/Android 的按鈕按壓回饋也是同樣邏輯。 */
.bigbtn,.pick,.chip,.tab,.role,.qbtn,.nav button,.qr-card,.cz-t,.cz-b{
  transition:transform .12s ease;
}
.bigbtn:active,.pick:active,.chip:active,.tab:active,.role:active,
.qbtn:active,.nav button:active,.qr-card:active,.cz-t:active,.cz-b:active{
  transform:scale(.96);
}

body{
  margin:0;padding:32px 16px 60px;
  background:var(--bg);
  font-family:var(--font);
  color:var(--ink);
}

/* 背景保持全白，不加裝飾色塊——之前那兩團模糊光暈會把白色染成淡紅／淡黃。 */

/* ===== 2. 桌機版頁首 ===== */
.page-head{max-width:1180px;margin:0 auto 26px;text-align:center}
.page-head h1{font-size:27px;margin:0 0 8px;letter-spacing:.5px}
.page-head h1 span{color:var(--head)}
.page-head p{margin:0;color:var(--ink-2);font-size:16px}
.badge{display:inline-block;margin-top:12px;background:var(--navy);color:#fff;
  font-size:13px;padding:5px 14px;border-radius:20px;letter-spacing:1px}

/* ===== 3. 畫面切換頁籤 ===== */
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px;margin:26px auto 24px}
.tab{
  background:#fff;border:2px solid var(--line);color:var(--ink-2);
  padding:11px 18px;border-radius:30px;font-size:15px;font-weight:600;
  cursor:pointer;transition:.15s;font-family:inherit;
}
.tab:hover{border-color:var(--navy)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ===== 4. 版面 ===== */
.stage{display:flex;gap:38px;justify-content:center;align-items:flex-start;
  max-width:1180px;margin:0 auto;flex-wrap:wrap}

/* ===== 5. 手機外框 ===== */
.phone{
  width:392px;flex:0 0 392px;background:#0d1418;border-radius:44px;padding:13px;
  /* 背景改成純白之後，原本外圍那圈品牌紅暈光會在白底上變成一圈粉紅，很髒，
     改回單純的中性深色投影。 */
  box-shadow:0 22px 50px rgba(20,35,55,.22);
  position:relative;
}
.notch{position:absolute;top:13px;left:50%;transform:translateX(-50%);
  width:132px;height:26px;background:#0d1418;border-radius:0 0 16px 16px;z-index:6}
.screen{
  background:var(--tint);border-radius:33px;overflow:hidden;height:768px;
  display:flex;flex-direction:column;position:relative;
}
/* 標題列改成白底深字（原本是整塊實色紅底＋白字）。
   康和「好康 fun 心投」官網的頁首就是白底＋紅黑原版 logo，這樣改有三個好處：
     1. 少一大塊紅，整體不再刺眼
     2. logo 可以用官方原版配色，不必再做一張白色反白版
     3. 標題文字對比度從「白配紅 5.05:1」提高到「深褐配白 12:1 以上」
   底部留一條品牌紅細線當視覺錨點，仍看得出是康和的紅。 */
.statusbar{height:34px;flex:0 0 34px;background:var(--tint-2);color:var(--ink);
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 20px 4px;font-size:13px;font-weight:600}
.appbar{background:var(--tint-2);color:var(--ink);padding:8px 20px 14px;
  border-bottom:3px solid var(--navy)}
.appbar .bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.appbar .greet{font-size:15px;color:var(--ink-2)}
.appbar .title{font-size:23px;font-weight:700;margin-top:3px;color:var(--head)}
/* 無障礙：字級切換鈕（點一下循環 標準 → 大 → 特大） */
.a11y{background:var(--tint-2);border:0;border-radius:20px;color:var(--ink-2);
  font-family:inherit;font-size:13px;font-weight:700;padding:7px 13px;cursor:pointer;
  display:flex;align-items:center;gap:5px}
.a11y .a11y-a{font-size:17px;font-weight:800;line-height:1}
.body{flex:1;overflow-y:auto;padding:18px 16px 20px;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{width:0}

/* ===== 6. 底部導覽列 ===== */
.nav{flex:0 0 76px;background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;padding-bottom:8px}
.nav button{background:none;border:0;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#93A5B1;font-size:12px;font-weight:600;padding:6px 4px;flex:1}
.nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--navy)}

/* ===== 7. 通用卡片 ===== */
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;
  box-shadow:0 2px 8px rgba(15,76,117,.07)}
.card h3{margin:0 0 12px;font-size:18px;font-weight:700}
.sub{font-size:14px;color:var(--ink-2);line-height:1.6}

/* ===== 8. 主要金額區塊 ===== */
/* 原本是整塊實色紅底＋白字，看起來像一大塊警示色。
   改成白底卡片＋左側色條＋數字本身用色，紅色變成點綴不是背景，
   跟康和「好康 fun 心投」官網的做法一致（白底配色塊點綴，不是滿版色底）。 */
.hero{background:var(--card);border:2px solid var(--line);border-left:7px solid var(--navy);
  border-radius:20px;padding:22px 20px;margin-bottom:16px;color:var(--ink)}
.hero .lbl{font-size:16px;color:var(--ink-2)}
.hero .amt{font-size:46px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;
  line-height:1.05;color:var(--head)}
.hero .amt small{font-size:20px;font-weight:600;margin-right:4px;color:var(--ink-2)}
/* border:0 是必要的：桌機右側講稿的卡片也叫 .note，它的 border-left:5px 會漏進來，
   配上這裡的 border-radius 會在左邊畫出一條括號狀的弧線。 */
.hero .note{font-size:14.5px;color:var(--ink-2);margin-top:8px;border:0;
  background:var(--tint);padding:7px 12px;border-radius:10px;display:inline-block;font-weight:600}
/* 模擬狀態（在 ② 選了補缺口方案之後）：整張卡換成金色實底＋白字。
   一般狀態是白卡藍字、模擬狀態是金卡白字，兩者一眼就分得出來，
   在整頁白卡之中也最搶眼。
   填色刻意用壓深的金（#A8680C→#8A5510）：亮金 #E9A227 配白字只有 2.17:1，
   完全過不了 WCAG AA；壓深後 4.52:1 才安全。亮金移到外框，維持搶眼的感覺。 */
.hero.sim{background:linear-gradient(140deg,#A8680C 0%,#8A5510 100%);
  border:2px solid var(--gold);border-left:7px solid var(--gold);color:#fff;
  box-shadow:0 6px 20px rgba(138,85,16,.28)}
.hero.sim .lbl{color:#fff}
.hero.sim .amt{color:#fff}
.hero.sim .amt small{color:#fff}
/* 說明列用「加深」的半透明黑，不要用半透明白——半透明白會把金底提亮，
   反而讓白字更看不清楚。 */
.hero.sim .note{background:rgba(0,0,0,.20);color:#fff}

/* ===== 9. 現金流月曆 ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:18px}
.cal-head span{color:var(--head);font-size:22px;font-weight:700;padding:0 8px;cursor:pointer}
/* minmax(0,1fr)：1fr 的隱含最小值是內容寬度，放大字級時 7 欄會壓不下去而溢出，
   改成 minmax(0,1fr) 才能真的等分縮小 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{text-align:center;font-size:13px;color:var(--ink-2);font-weight:700;padding:4px 0}
.cal .day{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:15px;font-weight:600;
  border:2px solid transparent;background:var(--tint);color:var(--ink)}
.cal .day.blank{background:transparent}
.cal .day.pay{background:var(--gold-lt);border-color:var(--gold);color:var(--head);cursor:pointer}
.cal .day.pay .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:3px}
.cal .day.pay.sel{background:var(--gold);color:var(--ink)}
.cal .day.pay.sel .dot{background:#fff}
/* 模擬方案的入帳日：虛線外框，跟真實入帳區隔開 */
.cal .day.plan{background:#fff;border:2.5px dashed var(--gold);color:var(--gold-tx)}
.cal .day.plan .dot{background:var(--gold)}
.cal .day.plan.sel{background:var(--gold);color:var(--ink);border-style:solid}

.pay-list{margin-top:14px;border-top:2px dashed var(--line);padding-top:12px}
.pay-row{display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line-2);font-size:16px}
.pay-row:last-child{border-bottom:0}
.pay-row .d{color:var(--ink-2);font-size:14px}
.pay-row .n{font-weight:600}
.pay-row .v{color:var(--green);font-weight:800;font-size:18px}
.pay-row.sim .n{color:var(--gold-tx)}
.pay-row.sim .v{color:var(--gold-tx)}
.pay-total{border-top:2px solid var(--line);margin-top:6px;padding-top:12px}
.pay-total .n{font-size:17px}
.pay-total .v{font-size:22px}
.list-title{margin-bottom:8px;font-weight:600;color:var(--ink);font-size:14px}

/* ===== 9-2. 畫面 ① 的左右子頁切換（現金流月曆 ／ 老本撐多久） ===== */
.subtabs{display:flex;gap:4px;background:var(--tint-2);border-radius:14px;padding:4px;margin-bottom:16px}
.subtab{flex:1;min-width:0;background:none;border:0;border-radius:11px;
  font-family:inherit;font-size:16px;font-weight:700;color:var(--ink-2);
  padding:13px 6px;cursor:pointer;transition:.15s;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.subtab.on{background:#fff;color:var(--head);box-shadow:0 1px 4px rgba(15,76,117,.16)}

/* ==========================================================================
   9-3. 吉祥物「小方」
   --------------------------------------------------------------------------
   圖形是 screens.js 的 S.mk()（SVG）。這裡只管大小、位置與動畫。
   四種尺寸：mk-lg 大 / mk-md 中 / mk-sm 小 / mk-av 對話頭像
   mk-peek 是「從金額卡右下角冒出來」的特別用法。
   ========================================================================== */
.mk{display:block;flex:0 0 auto;overflow:visible}
.mk-lg{width:118px}
.mk-md{width:78px}
.mk-sm{width:56px}
.mk-av{width:38px;align-self:flex-end;margin-bottom:-2px}

/* 小方 ＋ 對話泡泡 */
.mk-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.mk-say{position:relative;flex:1;min-width:0;background:#fff;border:2px solid var(--line);
  border-radius:16px;padding:13px 15px;font-size:15px;line-height:1.65;color:var(--ink);
  text-align:left}
.mk-say b{color:var(--head)}
/* 泡泡左邊的小尖角：旋轉 45° 的方塊，只留左下兩邊框線，接縫才不會露出來 */
.mk-say::after{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;
  width:12px;height:12px;background:#fff;transform:rotate(45deg);
  border-left:2px solid var(--line);border-bottom:2px solid var(--line)}
.card .mk-row{margin-bottom:0}
.card .mk-say{background:var(--tint)}
.card .mk-say::after{background:var(--tint)}

/* 動畫：浮動、揮手、眨眼 */
.mk-b{animation:mkFloat 3.4s ease-in-out infinite}
.mk-h{transform-origin:92px 100px;animation:mkWave 1.9s ease-in-out infinite}
.mk-e{animation:mkBlink 5.2s infinite}
@keyframes mkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
@keyframes mkWave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(18deg)}}
@keyframes mkBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
/* 使用者若在系統關掉動態效果，就完全靜止（前庭失調與暈眩考量） */
@media (prefers-reduced-motion:reduce){
  .mk-b,.mk-h,.mk-e{animation:none}
}

/* ===== 10. 區塊小標與鍵值列（月退俸／投資頁共用） ===== */
.sec-h{font-size:16px;font-weight:700;color:var(--head);margin:20px 0 10px;
  padding-left:11px;border-left:5px solid var(--navy)}
/* 分類標題正下方的一句白話解釋（投資頁用），字級小、灰色，不搶標題的視覺重量 */
.sec-d{font-size:13px;color:var(--ink-2);line-height:1.6;margin:-4px 0 12px;padding-left:11px}
/* ETF 內部的小分類標題（市值型／高股息…），比 .sec-h 再輕一階 */
.sec-h2{font-size:13.5px;font-weight:700;color:var(--teal);margin:14px 0 8px;
  padding-left:11px;border-left:3px solid var(--teal)}
.kv-row{display:flex;justify-content:space-between;align-items:center;
  padding-top:13px;margin-top:13px;border-top:1px dashed var(--line);font-size:15.5px;color:var(--ink-2)}
.kv-row b{font-size:19px;color:var(--head)}

/* ===== 11. 試算滑桿 ===== */
.slider-wrap{margin:16px 0 6px}
.slider-val{font-size:32px;font-weight:800;color:var(--head);text-align:center;margin-bottom:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:10px;
  background:var(--track);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;
  border-radius:50%;background:#fff;border:5px solid var(--navy);cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.22)}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;
  background:#fff;border:5px solid var(--navy);cursor:pointer}
.range-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:6px}

.result{background:var(--green-lt);border-radius:16px;padding:18px;text-align:center;margin-top:16px;
  border:2px solid #BFE0CE}
.result.warn{background:var(--gold-lt);border-color:#EBCB94}
.result.bad{background:var(--red-lt);border-color:#F0BDB6}
.result .lbl{font-size:16px;color:var(--ink-2)}
.result .big{font-size:44px;font-weight:800;color:var(--green);line-height:1.1;margin:4px 0}
.result.warn .big{color:var(--gold-tx)}
.result.bad .big{color:var(--red)}
.result .tip{font-size:14.5px;color:var(--ink-2);margin-top:6px;line-height:1.6}

.timeline{height:26px;border-radius:13px;background:var(--track);overflow:hidden;margin:14px 0 4px;position:relative}
.timeline .fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));
  transition:width .6s;display:flex;align-items:center;justify-content:flex-end;
  padding-right:9px;color:#fff;font-size:12.5px;font-weight:700}

/* ===== 12. 提示與警示卡 ===== */
.alert{border-radius:16px;padding:16px;margin-bottom:13px;display:flex;gap:13px;align-items:flex-start}
.alert .ic{flex:0 0 42px;height:42px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:22px}
.alert.hi{background:var(--red-lt);border:2px solid #F0BDB6}
.alert.hi .ic{background:var(--red);color:#fff}
.alert.md{background:var(--gold-lt);border:2px solid #EBCB94}
.alert.md .ic{background:var(--gold);color:var(--ink)}
.alert.ok{background:var(--green-lt);border:2px solid #BFE0CE}
.alert.ok .ic{background:var(--green);color:#fff}
.alert .t{font-size:16.5px;font-weight:700;margin-bottom:4px}
.alert .x{font-size:14.5px;color:var(--ink-2);line-height:1.62}

/* ===== 13. 大按鈕（樂齡設計：高度 ≥ 56px） ===== */
.bigbtn{width:100%;border:0;border-radius:16px;padding:19px;font-size:19px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-bottom:11px;display:flex;
  align-items:center;justify-content:center;gap:9px}
.bigbtn.p{background:var(--navy);color:#fff}
.bigbtn.r{background:var(--red);color:#fff}
.bigbtn.t{background:var(--teal);color:#fff}
.bigbtn.o{background:#fff;color:var(--navy);border:2.5px solid var(--navy)}
.bigbtn.sm{padding:14px;font-size:16px;margin-top:12px}
a.bigbtn{text-decoration:none}   /* 撥號與外連用 <a>，外觀要跟 <button> 一致 */

/* 手機標題列右側的 logo：白底標題列配官方原版紅黑配色，每一頁都看得到 */
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.bar-logo{flex:0 0 auto;width:104px;height:19px;margin-bottom:3px;
  background-repeat:no-repeat;background-position:center;background-size:contain}

/* 大按鈕：左圖示、右兩行字（掌先機、投顧網站、樂齡專線共用） */
.cz{margin-bottom:4px}
.cz-b{text-decoration:none;justify-content:flex-start;gap:14px;padding:17px 18px;text-align:left}
.cz-ic{width:30px;height:30px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.cz-tx{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.cz-tx i{font-style:normal;font-size:13.5px;font-weight:600;opacity:.78;margin-top:3px}

/* 康和專區最上面：小方帶路 ＋ 帳號綁定狀態 */
.cz-head{text-align:center}
.cz-head .cz-bind{margin-top:14px}
.cz-bind{margin-top:2px;display:inline-block;background:var(--green-lt);color:var(--green);
  font-size:13.5px;font-weight:700;padding:6px 13px;border-radius:20px}

/* 營業員名片卡 */
.cz-nc .cl-sub{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:2px}

/* 其他服務：兩欄圖示格 */
.cz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cz-t{background:var(--card);border-radius:16px;padding:15px 13px;text-decoration:none;
  box-shadow:0 2px 8px rgba(15,76,117,.07);display:flex;flex-direction:column;gap:3px;
  min-height:104px;cursor:pointer}
.cz-t svg{width:27px;height:27px;fill:none;stroke:var(--navy);stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:4px}
.cz-t b{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.3}
.cz-t i{font-style:normal;font-size:12.5px;color:var(--ink-2);line-height:1.45}

/* 防詐守門員 */
.cz-in{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px;
  font-family:inherit;font-size:16px;line-height:1.6;color:var(--ink);
  margin:12px 0 0;resize:vertical}
.cz-in:focus{outline:none;border-color:var(--teal)}
/* 檢查結果：紅旗可能有好幾條，改成圖示在上、內容佔滿整行才讀得舒服 */
.czr{margin-top:14px;display:block}
.czr .ic{margin-bottom:9px}
.cz-flag{background:rgba(255,255,255,.7);border-radius:10px;padding:9px 11px;margin:8px 0;
  font-size:14px;color:var(--ink-2);line-height:1.6}
.cz-flag b{display:block;color:var(--red);font-size:14.5px;margin-bottom:2px}

/* 康和快訊 */
.cz-nw{padding:12px 0}
.cz-nw.bd{border-top:1px solid var(--line-2)}
.cz-nw-t{font-size:16px;font-weight:700;color:var(--ink);line-height:1.45}
.cz-nw-x{font-size:13.5px;color:var(--teal);line-height:1.6;margin-top:5px}

/* ===== 14. 風險等級標籤 RR1–RR5 ===== */
.pill{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:20px;
  background:var(--green-lt);color:var(--green);white-space:nowrap;flex:0 0 auto}
.pill.rr1,.pill.rr2{background:var(--green-lt);color:var(--green)}
.pill.rr3{background:#E2F0F3;color:var(--teal)}
.pill.rr4{background:var(--gold-lt);color:var(--gold-tx)}
.pill.rr5{background:var(--red-lt);color:var(--red)}

/* ===== 15. 月退俸：補足缺口的方案卡 ===== */
.sol{background:var(--card);border-radius:var(--radius);padding:17px;margin-bottom:12px;
  border:2px solid var(--line);box-shadow:0 2px 10px rgba(15,76,117,.05)}
.sol.s-a{border-left:7px solid var(--green)}
.sol.s-b{border-left:7px solid var(--teal)}
.sol.s-c{border-left:7px solid var(--gold)}
.sol-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.sol-tag{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:1px}
.sol-nm{font-size:20px;font-weight:800;color:var(--ink)}
.sol-cat{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.sol-need{display:flex;align-items:baseline;justify-content:space-between;
  background:var(--tint);border-radius:12px;padding:11px 14px;margin:11px 0 9px}
.sol-need span{font-size:14.5px;color:var(--ink-2)}
.sol-need b{font-size:27px;font-weight:800;color:var(--head)}
.sol-d{font-size:14px;color:var(--ink-2);line-height:1.62;margin-bottom:4px}
.sol-fit{font-size:13.5px;font-weight:600;margin-top:9px;padding:8px 11px;border-radius:10px;line-height:1.55}
.sol-fit.ok{background:var(--green-lt);color:var(--green)}
.sol-fit.no{background:var(--gold-lt);color:#9A5F0C}

/* ===== 16. 投資頁：風險屬性、分類籤、商品卡 ===== */
.kyc{border-left:7px solid var(--navy)}
.kyc-l{font-size:14px;color:var(--ink-2)}
.kyc-v{font-size:21px;font-weight:800;color:var(--head);margin:3px 0 8px;
  display:flex;align-items:center;flex-wrap:wrap;gap:4px}

/* RR1–RR5 白話對照卡：預設收合的 <details>，不會把下面的商品清單往下推。
   .card 原本的 18px padding 讓給 summary／rr-body 自己控制，避免雙重留白。 */
.rr-legend{padding:0}
.rr-legend summary{cursor:pointer;list-style:none;padding:16px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.rr-legend summary::-webkit-details-marker{display:none}
.rr-legend-h{font-size:15px;font-weight:700;color:var(--ink)}
.rr-legend .rr-arrow{color:var(--ink-2);font-size:13px;flex:0 0 auto;transition:transform .2s}
.rr-legend[open] .rr-arrow{transform:rotate(180deg)}
.rr-body{padding:0 18px 14px}
.rr-row{display:flex;align-items:center;gap:11px;padding:8px 0;font-size:13.5px;
  color:var(--ink-2);border-top:1px solid var(--line-2)}
.rr-row:first-of-type{border-top:0}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;margin-bottom:2px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;color:var(--ink-2);
  border-radius:20px;padding:9px 15px;font-size:14.5px;font-weight:600;
  font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

.prod{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  border:2px solid var(--line);box-shadow:0 2px 10px rgba(15,76,117,.05)}
.prod.warn{border-color:#EBCB94}
.prod-top{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
.prod-nm{font-size:17.5px;font-weight:700;color:var(--ink);line-height:1.4}
.prod-cash{background:var(--gold-lt);border-radius:11px;padding:10px 13px;margin:10px 0 8px;
  font-size:15px;color:#8A5510;font-weight:600}
.prod-cash b{font-size:23px;font-weight:800;color:var(--gold-tx)}
.prod-cash.alt{background:var(--tint);color:var(--ink-2);font-weight:600}
.prod-d{font-size:14px;color:var(--ink-2);line-height:1.62}
.prod-meta{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.prod-meta span{background:var(--tint);border-radius:8px;padding:4px 9px}

/* 「還不確定？問小幫手」——刻意做成小小的文字連結，不是按鈕，
   份量要比下面的「試算並申購」CTA 輕，才不會兩個搶視覺。 */
.prod-help{display:flex;justify-content:flex-end;margin-top:9px}
.prod-help button{background:none;border:0;color:var(--teal);font-size:13.5px;font-weight:600;
  font-family:inherit;cursor:pointer;padding:4px 2px}
.prod-help button:hover{text-decoration:underline}

/* ===== 17. AI 小幫手：對話、快捷問題、麥克風 ===== */
.chat{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
/* AI 回答：小方的頭像 ＋ 泡泡 */
.bbr{display:flex;align-items:flex-end;gap:7px;max-width:94%;align-self:flex-start}
.bbr .bb{max-width:none}
.bb{max-width:88%;padding:14px 16px;border-radius:18px;font-size:15.5px;line-height:1.68}
.bb.ai{background:var(--card);border:2px solid var(--line);border-bottom-left-radius:5px;
  align-self:flex-start;color:var(--ink)}
.bb.me{background:var(--navy);color:#fff;border-bottom-right-radius:5px;
  align-self:flex-end;font-weight:600}
.bb.typing{color:var(--ink-2);font-style:italic}
.ai-go{display:block;width:100%;margin-top:11px;background:#fff;color:var(--navy);
  border:2px solid var(--navy);border-radius:12px;padding:11px;font-size:15px;
  font-weight:700;font-family:inherit;cursor:pointer}
.alert .ai-go{margin-top:10px}

.quick{margin-bottom:14px}
.qbtn{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:15px 16px;font-size:16px;font-family:inherit;color:var(--ink);
  cursor:pointer;margin-bottom:9px;line-height:1.5}
.qbtn:hover{border-color:var(--navy)}

.mic{width:100%;border:0;border-radius:16px;padding:20px;font-size:20px;font-weight:700;
  font-family:inherit;cursor:pointer;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:12px}
.mic .mic-ic{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 26px}
.mic.on{background:var(--red)}

.disc{font-size:12.5px;color:var(--ink-2);line-height:1.7;background:var(--tint-2);
  border-radius:12px;padding:12px 14px;margin-bottom:12px}
/* 同一個揭露框裡的第二段（通用風險揭露），用細線跟上一段分開 */
.disc-x{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.spk{display:block;margin-top:10px;background:var(--tint);border:0;border-radius:10px;
  padding:9px 13px;font-size:14px;font-family:inherit;color:var(--head);
  font-weight:600;cursor:pointer}

/* ===== 18. 卡片內的次要動作鈕（選方案、試算並申購、撥電話） =====
   顏色照「這顆按鈕在做什麼」分配，不要全部都是紅的：
     預設（金色）＝ 探索、試算、看更多——按下去不會發生實際交易
     .pick.t（青色）＝ 聯絡人：撥電話、預約回電
   真正會成交的動作（確認送出、預約營業員）才用紅色的 .bigbtn.p。
   這是照康和「好康 fun 心投」官網的做法：紅／金／青輪流用，紅色留給最重要的那一個。 */
.pick{width:100%;margin-top:11px;background:var(--navy);color:#fff;border:0;
  border-radius:12px;padding:14px;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer}
.pick.t{background:var(--teal);color:#fff}
.prod.open .pick{background:#fff;color:var(--navy);border:2px solid var(--navy)}

/* ===== 19. 申購試算面板 ===== */
.order{margin-top:14px;padding-top:15px;border-top:2px dashed var(--line)}
.ord-h{font-size:16px;font-weight:700;margin-bottom:10px}
.ord-out{display:flex;gap:10px;margin:14px 0 10px}
.ord-out>div{flex:1;background:var(--gold-lt);border-radius:12px;padding:11px 13px}
.ord-out span{display:block;font-size:13px;color:var(--ink-2)}
.ord-out b{font-size:20px;color:var(--gold-tx);font-weight:800}
.ord-out .alt{flex:1;background:var(--tint);color:var(--ink-2);font-size:14px;line-height:1.6}
.ord-fee{font-size:14px;color:var(--ink-2);background:var(--tint);border-radius:10px;
  padding:10px 13px;margin-bottom:13px}
.ord-fee b{color:var(--head);font-size:16px}

/* ===== 20. 二次確認浮層（防誤觸） ===== */
.sheet{position:absolute;inset:0;background:rgba(10,32,50,.55);display:none;
  align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet-box{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:22px 18px 18px;
  max-height:88%;overflow-y:auto}
.sheet-t{font-size:15px;color:var(--ink-2);text-align:center}
.sheet-big{font-size:23px;font-weight:800;color:var(--head);text-align:center;margin:6px 0 16px;line-height:1.35}
.sheet-kv{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line-2);font-size:15.5px;color:var(--ink-2)}
.sheet-kv b{font-size:20px;color:var(--ink);font-weight:800}
.sheet-kv.full{display:block;line-height:1.7;border-bottom:0;text-align:center;color:var(--ink)}
.sheet-kv.full.sub{font-size:14px;color:var(--ink-2);padding-top:0}
.sheet-warn{background:var(--gold-lt);border-radius:12px;padding:13px;margin:14px 0 16px;
  font-size:14px;color:#8A5510;line-height:1.65}
/* 對話框裡的大字說明（樂齡基準：內文 ≥ 18px） */
.sheet-x{font-size:18px;line-height:1.8;color:var(--ink);margin:2px 0 18px}
.sheet-x b{color:var(--head)}
.ok-ic{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;
  font-size:36px;display:flex;align-items:center;justify-content:center;margin:4px auto 12px}

/* ===== 21. 身分切換（客戶 / 營業員） ===== */
.roles{display:flex;gap:9px;justify-content:center;margin:0 auto 4px;max-width:900px}
.role{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 20px;
  font-family:inherit;font-size:15px;font-weight:700;color:var(--ink-2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;line-height:1.35}
.role span{font-size:12.5px;font-weight:600;opacity:.8}
.role.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ===== 22. 營業員視角：待辦與客戶卡 ===== */
/* 跟客戶端的 hero（紅→深紅）做區隔，用深紅→暗棕紅，維持柔和不要接近全黑，
   看起來更沉穩而不是壓迫 */
/* 營業員的數字卡：跟客戶端一樣改成白底，但色條與數字用青色，
   一眼就分得出「這是內部視角」，也不會又是一大塊紅 */
.hero.adv{border-left-color:var(--teal)}
.hero.adv .amt{color:var(--teal)}

.todo,.cl{background:var(--card);border-radius:var(--radius);padding:15px 16px;margin-bottom:11px;
  border:2px solid var(--line);box-shadow:0 2px 10px rgba(15,76,117,.05)}
.cl.me{border-color:var(--navy)}
.todo-top{display:flex;align-items:center;justify-content:space-between;gap:9px}
.todo-top b{font-size:18.5px;color:var(--ink)}
.todo-x{font-size:14.5px;color:var(--ink-2);margin-top:7px}
.todo-x b{color:var(--head);font-size:17px}
.todo-sig{font-size:13.5px;color:var(--ink-2);background:var(--tint);border-radius:10px;
  padding:9px 12px;margin-top:9px;line-height:1.6}
.todo-sig i,.cl-sig i{font-style:normal;color:#8496A3}

.cl-head{display:flex;align-items:center;gap:12px}
.cl-nm{font-size:18.5px;font-weight:700}
.cl-sub{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.cl-head .pill{margin-left:auto}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex:0 0 46px}
.cl-sig{font-size:14px;color:var(--ink-2);background:var(--tint);border-radius:10px;
  padding:10px 12px;margin-top:11px;line-height:1.6}
.cl-gap{font-size:14.5px;color:var(--ink-2);margin-top:9px}
.cl-gap b{color:var(--head);font-size:17px}

.pill.hot3{background:var(--red-lt);color:var(--red)}
.pill.hot2{background:var(--gold-lt);color:var(--gold-tx)}
.pill.hot1{background:var(--tint-2);color:var(--ink-2)}

.tl{padding:11px 0 11px 16px;border-left:3px solid var(--line);position:relative}
.tl::before{content:"";position:absolute;left:-6.5px;top:16px;width:10px;height:10px;
  border-radius:50%;background:var(--navy)}
.tl:last-child{padding-bottom:0}
.tl-t{font-size:12.5px;color:#8496A3;font-weight:700}
.tl-x{font-size:14.5px;color:var(--ink);line-height:1.6;margin-top:2px}

/* ===== 23. 右側簡報講稿 ＋ QR code ===== */
/* 右側講稿的高度鎖定跟手機外框一樣高（.screen 768px + .phone 上下 padding 各 13px），
   講稿自己內部捲動，不會把整個瀏覽器頁面撐得比手機還高，卡片也不會在頁面邊界被切一半。
   如果之後改了 .phone 的 padding 或 .screen 的 height，這裡要跟著改。 */
.notes-col{flex:1 1 330px;max-width:400px;height:794px;
  display:flex;flex-direction:column}
.notes{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 6px 6px 0}
.notes::-webkit-scrollbar{width:6px}
.notes::-webkit-scrollbar-thumb{background:#D8CCB8;border-radius:3px}
.notes h2{font-size:20px;margin:0 0 4px;color:var(--head)}
.notes .kicker{font-size:13px;letter-spacing:2px;color:var(--gold-tx);font-weight:700;margin-bottom:6px}
.notes .lead{font-size:15.5px;color:var(--ink-2);line-height:1.75;margin:0 0 18px}

/* 手機掃描 QR code：跟講稿是獨立容器，切換頁面不會被洗掉。
   點這張小卡會放大（見下方 24 區），方便台下的人掃描。 */
.qr-card{background:#fff;border-radius:14px;padding:15px;margin-bottom:16px;
  display:flex;gap:13px;align-items:center;box-shadow:0 2px 7px rgba(15,76,117,.07);
  cursor:pointer}
.qr-card:hover{box-shadow:0 4px 14px rgba(15,76,117,.14)}
.qr-card .qr-img{width:84px;height:84px;flex:0 0 84px;border-radius:8px}
.qr-card .qr-tx{min-width:0}
.qr-card .qr-tx b{display:block;font-size:14.5px;color:var(--head);margin-bottom:4px}
.qr-card .qr-tx span{font-size:12.5px;color:var(--ink-2);line-height:1.5;word-break:break-all}
.qr-card .qr-tx i{display:block;font-style:normal;font-size:12px;color:var(--teal);
  font-weight:700;margin-top:5px}

/* QR code 的圖片本身：base104 內嵌，卡片版與放大版共用同一張圖，只是顯示尺寸不同。
   ------------------------------------------------------------------------
   QR:BEGIN — 這個規則由 產生QRcode.py 自動改寫，不要手動編輯這裡面的內容 */

/* ==========================================================================
   app.js — 程式邏輯
   --------------------------------------------------------------------------
   一般情況下不用改這個檔案。
   要改數字 → data.js ／ 要改版型 → screens.js ／ 要改講稿 → notes.js
   ========================================================================== */

(function () {
  'use strict';

  var ROLE    = 'client';   // client | advisor
  var current = 'cash';
  var fontIdx = 0;          // 目前字級（對應 FONT_STEPS）
  var orderKey = null;      // 投資頁展開中的申購試算是哪一檔商品
  var PENDING_ASK = null;   // 從投資頁按「問小幫手」點過來時，要自動問的商品名稱

  function screens() { return ROLE === 'advisor' ? SCREENS_ADVISOR : SCREENS_CLIENT; }

  /* ---------- 啟動 ---------- */
  function init() {
    buildRoles();
    bindOnce();
    paintFooter();
    paintQR();
    paintChrome();
    render(screens()[0].id);
    registerServiceWorker();
  }

  /* 桌機版頁尾的風險揭露，跟 App 內共用 data.js 的同一份文字 */
  function paintFooter() {
    var el = document.getElementById('footDisc');
    if (el) el.textContent = GENERAL_DISCLAIMER;
  }

  /* 桌機版右側的「手機掃描開啟」QR code。
     只在啟動時畫一次——它跟右側講稿是兩個獨立的容器，切頁不會把它洗掉。
     QR 圖片本身是內嵌在 css 的 .qr-card .qr-img（data URI），
     這裡只負責填文字、綁點擊放大；改網址、重產圖片請看 data.js 的 DEPLOY 註解。 */
  function paintQR() {
    var card = document.getElementById('qrCard');
    if (!card) return;
    card.innerHTML =
      '<div class="qr-img" aria-hidden="true"></div>' +
      '<div class="qr-tx"><b>' + DEPLOY.label + '</b>' +
      '<span>' + DEPLOY.url.replace(/^https?:\/\//, '') + '</span>' +
      '<i>點一下放大</i></div>';
    card.addEventListener('click', openQrZoom);

    var zoom = document.getElementById('qrZoom');
    if (!zoom) return;
    zoom.innerHTML =
      '<div class="qr-zoom-box">' +
        '<button class="qr-zoom-x" id="qrZoomX" aria-label="關閉">✕</button>' +
        '<div class="qr-zoom-h">' + DEPLOY.label + '</div>' +
        '<div class="qr-img-big" aria-hidden="true"></div>' +
        '<div class="qr-zoom-u">' + DEPLOY.url.replace(/^https?:\/\//, '') + '</div>' +
      '</div>';
    document.getElementById('qrZoomX').addEventListener('click', closeQrZoom);
    zoom.addEventListener('click', function (e) {
      if (e.target === zoom) closeQrZoom();   // 點背景空白處也能關
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeQrZoom();
    });
  }

  function openQrZoom()  { document.getElementById('qrZoom').classList.add('on'); }
  function closeQrZoom() { document.getElementById('qrZoom').classList.remove('on'); }

  /* 只綁一次的事件（元素本身不會被換掉，只換 innerHTML） */
  function bindOnce() {
    document.getElementById('roles').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (b) setRole(b.dataset.r);
    });
    document.getElementById('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (b) render(b.dataset.s);
    });
    document.getElementById('nav').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (b) render(b.dataset.s);
    });
    /* 畫面內任何 [data-go] 按鈕都能跳頁 */
    document.getElementById('body').addEventListener('click', function (e) {
      var b = e.target.closest('[data-go]');
      if (!b) return;
      /* 跳回 ① 一律停在月曆那一邊（會用到的情境都是要看月曆） */
      if (b.dataset.go === 'cash') SUB = 'cal';
      render(b.dataset.go);
    });
    document.getElementById('a11y').addEventListener('click', stepFont);
  }

  /* ---------- 身分切換 ---------- */
  function buildRoles() {
    document.getElementById('roles').innerHTML = ROLES.map(function (r) {
      return '<button class="role' + (r.id === ROLE ? ' on' : '') + '" data-r="' + r.id + '">' +
        r.nm + '<span>' + r.who + '</span></button>';
    }).join('');
  }

  function setRole(r) {
    if (r === ROLE) return;
    ROLE = r;
    setActive('#roles .role', r, 'r');
    paintChrome();
    render(screens()[0].id);
  }

  /* 重繪頁籤、底部導覽、問候語 */
  function paintChrome() {
    document.getElementById('greet').textContent =
      (ROLE === 'advisor' ? ADVISOR.name : CONFIG.userName) + '，早安';

    document.getElementById('tabs').innerHTML = screens().map(function (s) {
      return '<button class="tab" data-s="' + s.id + '">' + s.tab + '</button>';
    }).join('');

    document.getElementById('nav').innerHTML = screens().map(function (s) {
      return '<button data-s="' + s.id + '">' +
        '<svg viewBox="0 0 24 24">' + NAV_ICONS[s.id] + '</svg>' + s.nav + '</button>';
    }).join('');
  }

  /* ---------- 切換並繪製畫面 ---------- */
  function render(key) {
    if (!S[key]) return;
    current = key;
    closeSheet();

    var meta = screens().filter(function (s) { return s.id === key; })[0];
    if (!meta) return;

    /* 畫面 ① 有兩個子頁，標題與講稿要跟著左右切換 */
    var sub = (key === 'cash') ? curSub() : null;
    document.getElementById('scr-title').textContent = sub ? sub.title : meta.title;

    var body = document.getElementById('body');
    body.innerHTML = S[key]();
    body.scrollTop = 0;

    setActive('#tabs .tab', key, 's');
    setActive('#nav button', key, 's');
    renderNotes(sub ? sub.nt : key);

    if (key === 'cash')      initCashSubs();
    if (key === 'pension')   initPension();
    if (key === 'invest')    initInvest();
    if (key === 'ai')        initAI();
    if (key === 'advToday')  initAdvToday();
    if (key === 'advList')   initAdvList();

    initConcordsZone();   /* 有放康和專區的畫面才會接到東西 */
  }

  /* ---------- 畫面 ① 的左右子頁 ---------- */
  function curSub() {
    return CASH_SUBS.filter(function (s) { return s.id === SUB; })[0] || CASH_SUBS[0];
  }

  function initCashSubs() {
    document.getElementById('subtabs').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b || b.dataset.sub === SUB) return;
      SUB = b.dataset.sub;
      render('cash');
    });

    /* 兩個子頁各自的內容初始化 */
    if (SUB === 'calc') initCalc(); else initCalendar();
  }

  function setActive(sel, key, attr) {
    document.querySelectorAll(sel).forEach(function (el) {
      el.classList.toggle('on', el.dataset[attr] === key);
    });
  }

  /* ---------- 右側講稿 ---------- */
  function renderNotes(key) {
    var N = NOTES[key];
    if (!N) return;
    document.getElementById('notes').innerHTML =
      '<div class="kicker">' + N.k + '</div>' +
      '<h2>' + N.h + '</h2>' +
      '<p class="lead">' + N.lead + '</p>' +
      N.n.map(function (x) {
        return '<div class="note ' + x[2] + '"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>';
      }).join('');
  }

  /* ======================================================================
     無障礙：字級三段切換
     ====================================================================== */
  function stepFont() {
    fontIdx = (fontIdx + 1) % FONT_STEPS.length;
    var f = FONT_STEPS[fontIdx];
    ['body', 'nav'].forEach(function (id) {
      document.getElementById(id).style.zoom = f.z;
    });
    document.getElementById('a11yTx').textContent = f.k;
  }

  /* ---------- 共用小工具 ---------- */
  function paintTrack(sl) {
    var p = (sl.value - sl.min) / (sl.max - sl.min) * 100;
    /* 軌道未填滿的部分用 --track（暖米色），跟 styles.css 的色票一致，不要寫死顏色 */
    sl.style.background = 'linear-gradient(90deg,var(--teal) 0%,var(--teal) ' + p +
                          '%,var(--track) ' + p + '%,var(--track) 100%)';
  }

  /* 把「元」換算成「X 萬」 */
  function wan(v) { return Math.round(v / 10000).toLocaleString() + ' 萬'; }
  function nt(v)  { return 'NT$ ' + Math.round(v).toLocaleString(); }

  /* ======================================================================
     畫面 ①：現金流月曆（含 PLAN 模擬）
     ====================================================================== */
  function initCalendar() {
    var cal = document.getElementById('cal');
    if (!cal) return;

    var off = document.getElementById('planOff');
    if (off) off.addEventListener('click', function () { PLAN = null; render('cash'); });

    /* 自動計算當月 1 號是星期幾、當月共幾天 */
    var firstDay    = new Date(CONFIG.year, CONFIG.month - 1, 1).getDay();
    var daysInMonth = new Date(CONFIG.year, CONFIG.month, 0).getDate();

    var html = ['日','一','二','三','四','五','六'].map(function (d) {
      return '<div class="dow">' + d + '</div>';
    }).join('');

    for (var i = 0; i < firstDay; i++) html += '<div class="day blank"></div>';

    for (var d = 1; d <= daysInMonth; d++) {
      var isPay  = !!PAYS[d];
      var isPlan = !!PLAN && PLAN.day === d;
      var cls    = isPlan ? ' pay plan' : (isPay ? ' pay' : '');
      html += '<div class="day' + cls + '" data-d="' + d + '">' +
              d + (isPay || isPlan ? '<span class="dot"></span>' : '') + '</div>';
    }
    cal.innerHTML = html;

    cal.querySelectorAll('.day.pay').forEach(function (el) {
      el.addEventListener('click', function () { showPay(+el.dataset.d); });
    });
    showPay(0);
  }

  function showPay(day) {
    document.querySelectorAll('.day.pay').forEach(function (e) {
      e.classList.toggle('sel', +e.dataset.d === day);
    });

    var box = document.getElementById('paylist');
    if (!box) return;

    /* 點到模擬方案那一天 */
    if (PLAN && day === PLAN.day) {
      box.innerHTML =
        '<div class="list-title">' + CONFIG.month + ' 月 ' + day + ' 日 入帳（模擬）</div>' +
        '<div class="pay-row sim"><div><span class="n">' + PLAN.nm + '</span>' +
        '<div class="d">' + PLAN.freq + '</div></div>' +
        '<span class="v">+' + PLAN.add.toLocaleString() + '</span></div>' +
        '<button class="bigbtn o sm" id="backAll">← 看本月全部</button>';
      bindBack();
      return;
    }

    if (!day) {
      var rows = '';
      Object.keys(PAYS).forEach(function (k) {
        PAYS[k].forEach(function (p) {
          rows += '<div class="pay-row"><div><span class="n">' + p.n + '</span>' +
                  '<div class="d">' + CONFIG.month + ' 月 ' + k + ' 日</div></div>' +
                  '<span class="v">+' + p.v.toLocaleString() + '</span></div>';
        });
      });
      if (PLAN) {
        rows += '<div class="pay-row sim"><div><span class="n">' + PLAN.nm + '（模擬）</span>' +
                '<div class="d">' + CONFIG.month + ' 月 ' + PLAN.day + ' 日　' + PLAN.freq + '</div></div>' +
                '<span class="v">+' + PLAN.add.toLocaleString() + '</span></div>';
      }
      box.innerHTML =
        '<div class="list-title">本月入帳明細（點月曆金點看細節）</div>' + rows +
        '<div class="pay-row pay-total"><span class="n">合計</span>' +
        '<span class="v">+' + (TOTAL + (PLAN ? PLAN.add : 0)).toLocaleString() + '</span></div>';
    } else {
      box.innerHTML =
        '<div class="list-title">' + CONFIG.month + ' 月 ' + day + ' 日 入帳</div>' +
        PAYS[day].map(function (p) {
          return '<div class="pay-row"><div><span class="n">' + p.n + '</span>' +
                 '<div class="d">' + p.d + '</div></div>' +
                 '<span class="v">+' + p.v.toLocaleString() + '</span></div>';
        }).join('') +
        '<button class="bigbtn o sm" id="backAll">← 看本月全部</button>';
      bindBack();
    }
  }

  function bindBack() {
    var back = document.getElementById('backAll');
    if (back) back.addEventListener('click', function () { showPay(0); });
  }

  /* ======================================================================
     畫面 ②：我的月退俸 —— 把缺口換算成本金，再配對可承作的商品
     ====================================================================== */
  function initPension() {
    var sl = document.getElementById('tgt');
    if (!sl) return;
    sl.addEventListener('input', function () { pension(+sl.value); paintTrack(sl); });
    paintTrack(sl);
    pension(+sl.value);

    document.getElementById('solbox').addEventListener('click', function (e) {
      var b = e.target.closest('[data-plan]');
      if (b) choosePlan(b.dataset.plan, +sl.value);
    });
  }

  function pension(target) {
    document.getElementById('tgtVal').textContent = 'NT$ ' + target.toLocaleString();

    var gap = target - TOTAL;
    var box = document.getElementById('gapbox');
    var sol = document.getElementById('solbox');

    /* 已達標：不製造假需求，改推「把多出來的錢鎖成終身給付」 */
    if (gap <= 0) {
      box.className = 'result';
      box.innerHTML =
        '<div class="lbl">您目前的月現金流</div>' +
        '<div class="big">已達標</div>' +
        '<div class="tip">每月入帳 NT$ ' + TOTAL.toLocaleString() +
        '，比目標多 <b>' + (-gap).toLocaleString() + ' 元</b>。' +
        '多出來的部分可以規劃旅遊、孫子的教育金，或轉入年金險鎖住終身給付。</div>';
      sol.innerHTML = '<button class="bigbtn o" data-go="invest">看看有什麼可以放的商品</button>';
      return;
    }

    box.className = 'result warn';
    box.innerHTML =
      '<div class="lbl">距離每月 ' + target.toLocaleString() + ' 元，還差</div>' +
      '<div class="big">' + gap.toLocaleString() + ' 元</div>' +
      '<div class="tip">一年就是 <b>' + (gap * 12).toLocaleString() +
      ' 元</b>。下面三個方法都可以把這個缺口補起來。</div>';

    sol.innerHTML =
      '<div class="sec-h">補足缺口的三個方法</div>' +
      SOLUTIONS.map(function (s) {
        var need   = Math.round(gap * 12 / s.y);        // 需投入本金
        var per100 = Math.round(1000000 * s.y / 12);    // 每 100 萬每月可領
        var fit    = s.rr <= CONFIG.maxRR;
        return '<div class="sol s-' + s.k + '">' +
          '<div class="sol-top">' +
            '<span class="sol-tag">' + s.tag + '</span>' +
            '<span class="pill rr' + s.rr + '">RR' + s.rr + '</span>' +
          '</div>' +
          '<div class="sol-nm">' + s.nm + '</div>' +
          '<div class="sol-cat">' + s.cat + '</div>' +
          '<div class="sol-need"><span>需投入本金</span><b>' + wan(need) + '</b></div>' +
          '<div class="sol-d">年配息約 ' + (s.y * 100).toFixed(1) + '%　·　每 100 萬每月約領 ' +
            per100.toLocaleString() + ' 元</div>' +
          '<div class="sol-d">' + s.d + '</div>' +
          '<div class="sol-fit ' + (fit ? 'ok' : 'no') + '">' +
            (fit ? '✓ 符合您的' + CONFIG.riskProfile + '風險屬性'
                 : '⚠ 超過您的風險屬性，65 歲以上須完成加強版適合度評估') +
          '</div>' +

  /* 選定方案 → 寫入 PLAN → 跳回月曆看「補完之後長什麼樣」 */
  function choosePlan(k, target) {
    var s   = SOLUTIONS.filter(function (x) { return x.k === k; })[0];
    var gap = target - TOTAL;
    if (!s || gap <= 0) return;
    var need = Math.round(gap * 12 / s.y);
    PLAN = {
      k: s.k, nm: s.nm, cat: s.cat, day: s.day, freq: s.freq,
      add: gap, need: need, needTx: wan(need), target: target
    };
    SUB = 'cal';        /* 模擬後要看的是月曆，不是試算 */
    render('cash');
  }

    var sl = document.getElementById('exp');

  /**
   * 逐月模擬資產耗損
   * 每月：餘額 × (1+月報酬) + 被動收入 − 開銷；開銷隨通膨遞增
   */
  function calc(expense) {
    document.getElementById('expVal').textContent = 'NT$ ' + expense.toLocaleString();

    var bal  = CONFIG.totalAssets;
    var age  = CONFIG.currentAge;
    var exp  = expense;
    var inc  = TOTAL;
    var rM   = Math.pow(1 + CONFIG.annualReturn, 1 / 12) - 1;
    var infM = Math.pow(1 + CONFIG.inflation, 1 / 12) - 1;
    var months = 0;
    var CAP = 111;

    while (bal > 0 && age < CAP) {
      bal = bal * (1 + rM) + inc - exp;
      exp *= (1 + infM);
      months++;
      if (months % 12 === 0) age++;
    }

    var safe = age >= CAP;
    var res  = document.getElementById('res');

    document.getElementById('resAge').textContent = safe ? '100 歲以上' : age + ' 歲';

    var pct = Math.max(6, Math.min(100,
      (Math.min(age, 105) - CONFIG.currentAge) / (105 - CONFIG.currentAge) * 100));
    document.getElementById('resFill').style.width = pct + '%';

    res.className = 'result' + (safe || age >= 90 ? '' : (age >= 82 ? ' warn' : ' bad'));

    document.getElementById('resTip').innerHTML =
      (safe || age >= 90) ? '很安全，還有餘裕可以規劃旅遊或給孫子的教育金。'
      : (age >= 82)       ? '大致足夠，但建議提高每月配息收入，減緩動用本金的速度。'
                          : '資產可能提早用完。<b>建議與康和營業員討論調整方案。</b>';
  }

  /* ----------------------------------------------------------------------
     開啟「掌先機」下單 App
     ----------------------------------------------------------------------
     Android：intent:// 帶套件名，沒安裝時瀏覽器自己走 fallback 到 Google Play。
     iOS：先試 URL Scheme，時間內畫面沒有被切走就當成沒安裝 → 跳說明對話框。
     桌機：本來就沒有 App，直接跳說明對話框並給 App Store 連結。
     ====================================================================== */
  function openTradeApp() {
    var a  = CONCORDS.app;
    var ua = navigator.userAgent;

    if (/Android/i.test(ua)) {
      location.href = 'intent://open#Intent;package=' + a.android +
        ';S.browser_fallback_url=' + encodeURIComponent(a.play) + ';end';
      return;
    }

    if (!/iPhone|iPad|iPod/i.test(ua)) { askInstall(); return; }

    var timer = setTimeout(function () {
      document.removeEventListener('visibilitychange', gone);
      askInstall();
    }, a.waitMs);

    /* 畫面被切走 ＝ App 真的開起來了，就不要再跳下載對話框 */
    function gone() {
      if (document.hidden) {
        clearTimeout(timer);
        document.removeEventListener('visibilitychange', gone);
      }
    }
    document.addEventListener('visibilitychange', gone);

    location.href = a.scheme;
  }

  /**
   * key     用來查 AI_ANSWERS 的題目
   * display 泡泡上要顯示的文字（語音輸入時是使用者實際說的話）
   */
  function ask(key, display) {
    var chat = document.getElementById('chat');
    if (!chat) return;

    chat.insertAdjacentHTML('beforeend', '<div class="bb me">' + (display || key) + '</div>');
    /* 每則回答都掛上小方的臉，看起來是「有人在回」而不是系統訊息 */
    chat.insertAdjacentHTML('beforeend',
      '<div class="bbr">' + S.mk('mk-av') +
      '<div class="bb ai typing">' + MASCOT.nm + '正在查…</div></div>');

    /* 把「問題」捲到最上方，回答就會完整出現在它下面 */
    var asked = chat.lastElementChild.previousElementSibling;
    scrollToEl(asked);

    setTimeout(function () {
      var t = chat.querySelector('.typing');
      if (!t) return;
      t.classList.remove('typing');

      /* 先查固定問答；查不到、且問句是「什麼是「XXX」？」這種格式，
         就試著當成商品名稱，自動生成一則說明（見 productAnswer）。
         這樣新增商品不用手動多寫一組 AI 問答，data.js 加一筆商品就自動有解說。 */
      var ans = AI_ANSWERS[key];
      if (!ans) {
        var m = /「(.+?)」/.exec(key);
        if (m) ans = productAnswer(m[1]);
      }

      t.innerHTML = ans ||
        '這個問題我還在學。要不要先<button class="ai-go" data-go="invest">看看商品清單</button>，' +
        '或直接請' + ADVISOR.name + '為您說明？';
      t.dataset.say = t.textContent;
      t.insertAdjacentHTML('beforeend', '<button class="spk">🔊 念給我聽</button>');
      scrollToEl(asked);
    }, 700);
  }

  /* 針對某一檔商品，自動組出一段白話說明（給④「問小幫手」用）。
     資料完全來自 data.js 的 PRODUCTS／RR_LEVELS，商品新增或改內容時
     這裡不用跟著改，說明會自動同步。 */
  function productAnswer(nm) {
    var p = PRODUCTS.filter(function (x) { return x.nm === nm; })[0];
    if (!p) return null;

    var rr     = RR_LEVELS.filter(function (r) { return r.n === p.rr; })[0];
    var per100 = p.y ? Math.round(1000000 * p.y / 12) : 0;
    var fit    = p.rr <= CONFIG.maxRR;

    return '<b>' + p.nm + '</b>　屬於「' + CAT_NAMES[p.c] + '」。<br>' +
      p.d + '<br>' +
      (per100
        ? '每投入 100 萬，每月約可領 <b>' + per100.toLocaleString() + '</b> 元。'
        : (p.altTx || '不配息，不以現金流計算。')) +
      '<br>風險等級 <b>RR' + p.rr + '</b>' + (rr ? '（' + rr.tx + '）' : '') + '。' +
      (fit ? '　✓ 符合您目前的風險屬性。'
           : '　⚠ 超過您目前的風險屬性，須完成加強版適合度評估後才能承作。') +
      '<button class="ai-go" data-go="invest">回去看其他商品</button>';
  }

  /* 捲動手機內容區，讓指定元素出現在頂端 */
  function scrollToEl(el) {
    var body = document.getElementById('body');

  /* ---------- 語音輸入：優先用瀏覽器原生辨識，不支援時退回模擬 ---------- */
  var voiceIdx = 0;

  function startVoice() {
    var mic = document.getElementById('mic');
    if (mic.classList.contains('on')) return;

    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR || location.protocol === 'file:') { simulateVoice(); return; }

    var r = new SR();
    r.lang = 'zh-TW';
    r.interimResults = false;
    r.maxAlternatives = 1;

    var got = false;
    micOn(true, '聆聽中…請說話');

    r.onresult = function (e) {
      got = true;
      var said = e.results[0][0].transcript;
      micOn(false);
      ask(matchVoice(said), said);
    };
    r.onerror = function () { micOn(false); if (!got) simulateVoice(); };
    r.onend   = function () { micOn(false); };

    try { r.start(); } catch (err) { micOn(false); simulateVoice(); }
  }

  /* 沒有語音辨識（或用 file:// 開啟）時，依序問下一個常見問題 */
  function simulateVoice() {
    micOn(true, '聆聽中…');
    setTimeout(function () {
      micOn(false);
      ask(AI_QUICK[voiceIdx % AI_QUICK.length]);
      voiceIdx++;
    }, 900);
  }

  function micOn(on, tx) {
    var mic = document.getElementById('mic');
    if (!mic) return;
    mic.classList.toggle('on', on);
    document.getElementById('micTx').textContent = on ? (tx || '聆聽中…') : '按住說話';
  }

  /* 聽到的話裡有哪個關鍵字，就對應到哪一題 */
  function matchVoice(said) {
    for (var i = 0; i < VOICE_MATCH.length; i++) {
      for (var j = 0; j < VOICE_MATCH[i].kw.length; j++) {
        if (said.indexOf(VOICE_MATCH[i].kw[j]) >= 0) return VOICE_MATCH[i].q;
      }
    }
    return said;   // 沒對上就原文送進去，會走預設回覆
  }

  /* ---------- 朗讀回答 ---------- */
  function speak(text) {
    if (!text || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.replace('🔊 念給我聽', ''));
    u.lang = 'zh-TW';
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }

  /* ======================================================================
     營業員視角
     ====================================================================== */
  function initAdvToday() {
    var withGap = CLIENTS.filter(function (c) { return c.gap > 0; })
                         .sort(function (a, b) { return b.gap - a.gap; });

    var totalGap = withGap.reduce(function (s, c) { return s + c.gap; }, 0);
    var scale    = totalGap * 12 / ADV_CONV.yield;      // 可承接規模
    var fee      = scale * ADV_CONV.feeRate;            // 預估手續費

    document.getElementById('advHero').innerHTML =
      '<div class="lbl">本月可轉換缺口（' + withGap.length + ' 位客戶）</div>' +
      '<div class="amt"><small>NT$</small>' + wan(scale) + '</div>' +
      '<div class="note">預估手續費收入 ' + nt(fee) + '　·　合計缺口 ' +
        totalGap.toLocaleString() + ' 元／月</div>';

    document.getElementById('advTodo').innerHTML = withGap.map(function (c) {
      var need = c.gap * 12 / ADV_CONV.yield;
      return '<div class="todo">' +
        '<div class="todo-top"><b>' + c.nm + '</b>' +
          '<span class="pill hot' + c.hot + '">缺口 ' + c.gap.toLocaleString() + '／月</span></div>' +
        '<div class="todo-x">可承接 <b>' + wan(need) + '</b>　·　預估手續費 ' +
          nt(need * ADV_CONV.feeRate) + '</div>' +
        '<div class="todo-sig">' + c.sig + '　<i>' + c.when + '</i></div>' +
        '<button class="pick t">撥電話</button>' +
      '</div>';
    }).join('');
  }

  function initAdvList() {
    var sorted = CLIENTS.slice().sort(function (a, b) {
      return (b.hot - a.hot) || (b.gap - a.gap);
    });
    var hotTx = { 3:'熱度高', 2:'熱度中', 1:'熱度低' };

    document.getElementById('advClients').innerHTML = sorted.map(function (c) {
      return '<div class="cl' + (c.nm === '陳伯伯' ? ' me' : '') + '">' +
        '<div class="cl-head">' +
          '<div class="avatar">' + c.nm.charAt(0) + '</div>' +
          '<div><div class="cl-nm">' + c.nm + '</div>' +
          '<div class="cl-sub">' + c.age + ' 歲　·　' + c.rr + '　·　AUM ' + wan(c.aum) + '</div></div>' +
          '<span class="pill hot' + c.hot + '">' + hotTx[c.hot] + '</span>' +
        '</div>' +
        '<div class="cl-sig">' + c.sig + '　<i>' + c.when + '</i></div>' +
        '<div class="cl-gap">' +
          (c.gap ? '每月缺口 <b>' + c.gap.toLocaleString() + ' 元</b>　→　可承接 ' +
                   wan(c.gap * 12 / ADV_CONV.yield)
                 : '月退俸已達標，適合談年金險與傳承規劃') +
        '</div>' +
        (c.nm === '陳伯伯' ? '<button class="pick" data-go="advClient">看詳情</button>' : '') +
      '</div>';
    }).join('');
  }

  /* ---------- PWA Service Worker ----------
     只有透過 http/https 開啟時才註冊（雙擊本機檔案時會自動略過，不會報錯） */
  function registerServiceWorker() {
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('service-worker.js').catch(function () { /* 忽略 */ });
    }
  }

  /* ---------- 開始 ---------- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
