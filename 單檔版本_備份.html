<!DOCTYPE html>
<!--
  康和「好日子」— 銀髮退休現金流管家　【單檔版本】

  雙擊開啟。要修改內容請改原始的 js/data.js，改完後執行 產生單檔.py
  重新產生一次，不要直接改這裡。
  產生日期：2026-07-30　·　對應 service-worker 版本：v3
  ------------------------------------------------------------------

<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>康和「好日子」— 銀髮退休現金流管家</title>
<meta name="description" content="康和證券銀髮理財 App 原型：現金流月曆、三桶水資產配置、老本試算、防詐守門員、家庭共管。">

<meta name="theme-color" content="#0F4C75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="好日子">

<style>
/* ==========================================================================
   康和「好日子」App 樣式表
   --------------------------------------------------------------------------
   想改「顏色」→ 改下面第 1 區的 :root 變數，全站會一起變
   想改「字級」→ 搜尋 font-size
   想改「手機尺寸」→ 搜尋 .phone 的 width、.screen 的 height
   ========================================================================== */

/* ===== 1. 色彩與設計變數（改這裡就能換整套配色） ===== */
:root{
  --navy:#0F4C75;        /* 主色：康和品牌藍 */
  --navy-dk:#0A3557;
  --teal:#1B7B8C;        /* 輔色 */
  --gold:#D98A1F;        /* 強調色：金額、入帳 */
  --gold-lt:#FBF0DC;
  --green:#2E7D5B;       /* 安全 / 正向 */
  --green-lt:#E4F2EA;
  --red:#C0392B;         /* 警告 / 詐騙 */
  --red-lt:#FBE9E7;
  --ink:#1C2B36;         /* 主要文字 */
  --ink-2:#4A5D6B;       /* 次要文字 */
  --line:#DDE5EB;
  --bg:#EEF2F5;
  --card:#FFFFFF;

  --radius:18px;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;padding:32px 16px 60px;
  background:var(--bg);
  font-family:var(--font);
  color:var(--ink);
}

/* ===== 2. 桌機版頁首 ===== */
.page-head{max-width:1180px;margin:0 auto 26px;text-align:center}
.page-head h1{font-size:27px;margin:0 0 8px;letter-spacing:.5px}
.page-head h1 span{color:var(--navy)}
.page-head p{margin:0;color:var(--ink-2);font-size:16px}
.badge{display:inline-block;margin-top:12px;background:var(--navy);color:#fff;
  font-size:13px;padding:5px 14px;border-radius:20px;letter-spacing:1px}

/* ===== 3. 畫面切換頁籤 ===== */
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px;margin:26px auto 24px}
.tab{
  background:#fff;border:2px solid var(--line);color:var(--ink-2);
  padding:11px 18px;border-radius:30px;font-size:15px;font-weight:600;
  cursor:pointer;transition:.15s;font-family:inherit;
}
.tab:hover{border-color:var(--navy)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ===== 4. 版面 ===== */
.stage{display:flex;gap:38px;justify-content:center;align-items:flex-start;
  max-width:1180px;margin:0 auto;flex-wrap:wrap}

/* ===== 5. 手機外框 ===== */
.phone{
  width:392px;flex:0 0 392px;background:#0d1418;border-radius:44px;padding:13px;
  box-shadow:0 26px 60px rgba(10,40,65,.30);position:relative;
}
.notch{position:absolute;top:13px;left:50%;transform:translateX(-50%);
  width:132px;height:26px;background:#0d1418;border-radius:0 0 16px 16px;z-index:6}
.screen{
  background:#F5F8FA;border-radius:33px;overflow:hidden;height:768px;
  display:flex;flex-direction:column;position:relative;
}
.statusbar{height:34px;flex:0 0 34px;background:var(--navy);color:#fff;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 20px 4px;font-size:13px;font-weight:600}
.appbar{background:var(--navy);color:#fff;padding:8px 20px 16px}
.appbar .bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.appbar .greet{font-size:15px;opacity:.85}
.appbar .title{font-size:23px;font-weight:700;margin-top:3px}
/* 無障礙：字級切換鈕（點一下循環 標準 → 大 → 特大） */
.a11y{background:rgba(255,255,255,.18);border:0;border-radius:20px;color:#fff;
  font-family:inherit;font-size:13px;font-weight:700;padding:7px 13px;cursor:pointer;
  display:flex;align-items:center;gap:5px}
.a11y .a11y-a{font-size:17px;font-weight:800;line-height:1}
.body{flex:1;overflow-y:auto;padding:18px 16px 20px;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{width:0}

/* ===== 6. 底部導覽列 ===== */
.nav{flex:0 0 76px;background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;padding-bottom:8px}
.nav button{background:none;border:0;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#93A5B1;font-size:12px;font-weight:600;padding:6px 4px;flex:1}
.nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--navy)}

/* ===== 7. 通用卡片 ===== */
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;
  box-shadow:0 2px 8px rgba(15,76,117,.07)}
.card h3{margin:0 0 12px;font-size:18px;font-weight:700}
.sub{font-size:14px;color:var(--ink-2);line-height:1.6}

/* ===== 8. 主要金額區塊 ===== */
.hero{background:linear-gradient(140deg,var(--navy) 0%,var(--teal) 100%);
  color:#fff;border-radius:20px;padding:22px 20px;margin-bottom:16px}
.hero .lbl{font-size:16px;opacity:.9}
.hero .amt{font-size:46px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;line-height:1.05}
.hero .amt small{font-size:20px;font-weight:600;margin-right:4px;opacity:.9}
.hero .note{font-size:14.5px;opacity:.9;margin-top:8px;
  background:rgba(255,255,255,.16);padding:7px 12px;border-radius:10px;display:inline-block}
/* 模擬狀態（使用者在 ② 選了補缺口方案之後） */
.hero.sim{background:linear-gradient(140deg,var(--gold) 0%,#B4700F 100%)}

/* ===== 9. 現金流月曆 ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:18px}
.cal-head span{color:var(--navy);font-size:22px;font-weight:700;padding:0 8px;cursor:pointer}
/* minmax(0,1fr)：1fr 的隱含最小值是內容寬度，放大字級時 7 欄會壓不下去而溢出，
   改成 minmax(0,1fr) 才能真的等分縮小 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{text-align:center;font-size:13px;color:var(--ink-2);font-weight:700;padding:4px 0}
.cal .day{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:15px;font-weight:600;
  border:2px solid transparent;background:#F5F8FA;color:var(--ink)}
.cal .day.blank{background:transparent}
.cal .day.pay{background:var(--gold-lt);border-color:var(--gold);color:var(--navy-dk);cursor:pointer}
.cal .day.pay .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:3px}
.cal .day.pay.sel{background:var(--gold);color:#fff}
.cal .day.pay.sel .dot{background:#fff}
/* 模擬方案的入帳日：虛線外框，跟真實入帳區隔開 */
.cal .day.plan{background:#fff;border:2.5px dashed var(--gold);color:var(--gold)}
.cal .day.plan .dot{background:var(--gold)}
.cal .day.plan.sel{background:var(--gold);color:#fff;border-style:solid}

.pay-list{margin-top:14px;border-top:2px dashed var(--line);padding-top:12px}
.pay-row{display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid #F0F4F7;font-size:16px}
.pay-row:last-child{border-bottom:0}
.pay-row .d{color:var(--ink-2);font-size:14px}
.pay-row .n{font-weight:600}
.pay-row .v{color:var(--green);font-weight:800;font-size:18px}
.pay-row.sim .n{color:var(--gold)}
.pay-row.sim .v{color:var(--gold)}
.pay-total{border-top:2px solid var(--line);margin-top:6px;padding-top:12px}
.pay-total .n{font-size:17px}
.pay-total .v{font-size:22px}
.list-title{margin-bottom:8px;font-weight:600;color:var(--ink);font-size:14px}

/* ===== 10. 區塊小標與鍵值列（月退俸／投資頁共用） ===== */
.sec-h{font-size:16px;font-weight:700;color:var(--navy);margin:20px 0 10px;
  padding-left:11px;border-left:5px solid var(--gold)}
.kv-row{display:flex;justify-content:space-between;align-items:center;
  padding-top:13px;margin-top:13px;border-top:1px dashed var(--line);font-size:15.5px;color:var(--ink-2)}
.kv-row b{font-size:19px;color:var(--navy)}

/* ===== 11. 試算滑桿 ===== */
.slider-wrap{margin:16px 0 6px}
.slider-val{font-size:32px;font-weight:800;color:var(--navy);text-align:center;margin-bottom:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:10px;
  background:#DCE6EC;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;
  border-radius:50%;background:#fff;border:5px solid var(--navy);cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.22)}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;
  background:#fff;border:5px solid var(--navy);cursor:pointer}
.range-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:6px}

.result{background:var(--green-lt);border-radius:16px;padding:18px;text-align:center;margin-top:16px;
  border:2px solid #BFE0CE}
.result.warn{background:var(--gold-lt);border-color:#EBCB94}
.result.bad{background:var(--red-lt);border-color:#F0BDB6}
.result .lbl{font-size:16px;color:var(--ink-2)}
.result .big{font-size:44px;font-weight:800;color:var(--green);line-height:1.1;margin:4px 0}
.result.warn .big{color:var(--gold)}
.result.bad .big{color:var(--red)}
.result .tip{font-size:14.5px;color:var(--ink-2);margin-top:6px;line-height:1.6}

.timeline{height:26px;border-radius:13px;background:#DCE6EC;overflow:hidden;margin:14px 0 4px;position:relative}
.timeline .fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));
  transition:width .6s;display:flex;align-items:center;justify-content:flex-end;
  padding-right:9px;color:#fff;font-size:12.5px;font-weight:700}

/* ===== 12. 提示與警示卡 ===== */
.alert{border-radius:16px;padding:16px;margin-bottom:13px;display:flex;gap:13px;align-items:flex-start}
.alert .ic{flex:0 0 42px;height:42px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:22px}
.alert.hi{background:var(--red-lt);border:2px solid #F0BDB6}
.alert.hi .ic{background:var(--red);color:#fff}
.alert.md{background:var(--gold-lt);border:2px solid #EBCB94}
.alert.md .ic{background:var(--gold);color:#fff}
.alert.ok{background:var(--green-lt);border:2px solid #BFE0CE}
.alert.ok .ic{background:var(--green);color:#fff}
.alert .t{font-size:16.5px;font-weight:700;margin-bottom:4px}
.alert .x{font-size:14.5px;color:var(--ink-2);line-height:1.62}

/* ===== 13. 大按鈕（樂齡設計：高度 ≥ 56px） ===== */
.bigbtn{width:100%;border:0;border-radius:16px;padding:19px;font-size:19px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-bottom:11px;display:flex;
  align-items:center;justify-content:center;gap:9px}
.bigbtn.p{background:var(--navy);color:#fff}
.bigbtn.r{background:var(--red);color:#fff}
.bigbtn.o{background:#fff;color:var(--navy);border:2.5px solid var(--navy)}
.bigbtn.sm{padding:14px;font-size:16px;margin-top:12px}

/* ===== 14. 風險等級標籤 RR1–RR5 ===== */
.pill{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:20px;
  background:var(--green-lt);color:var(--green);white-space:nowrap;flex:0 0 auto}
.pill.rr1,.pill.rr2{background:var(--green-lt);color:var(--green)}
.pill.rr3{background:#E2F0F3;color:var(--teal)}
.pill.rr4{background:var(--gold-lt);color:var(--gold)}
.pill.rr5{background:var(--red-lt);color:var(--red)}

/* ===== 15. 月退俸：補足缺口的方案卡 ===== */
.sol{background:var(--card);border-radius:var(--radius);padding:17px;margin-bottom:12px;
  border:2px solid var(--line);box-shadow:0 2px 10px rgba(15,76,117,.05)}
.sol.s-a{border-left:7px solid var(--green)}
.sol.s-b{border-left:7px solid var(--teal)}
.sol.s-c{border-left:7px solid var(--gold)}
.sol-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.sol-tag{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:1px}
.sol-nm{font-size:20px;font-weight:800;color:var(--ink)}
.sol-cat{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.sol-need{display:flex;align-items:baseline;justify-content:space-between;
  background:#F4F8FA;border-radius:12px;padding:11px 14px;margin:11px 0 9px}
.sol-need span{font-size:14.5px;color:var(--ink-2)}
.sol-need b{font-size:27px;font-weight:800;color:var(--navy)}
.sol-d{font-size:14px;color:var(--ink-2);line-height:1.62;margin-bottom:4px}
.sol-fit{font-size:13.5px;font-weight:600;margin-top:9px;padding:8px 11px;border-radius:10px;line-height:1.55}
.sol-fit.ok{background:var(--green-lt);color:var(--green)}
.sol-fit.no{background:var(--gold-lt);color:#9A5F0C}

/* ===== 16. 投資頁：風險屬性、分類籤、商品卡 ===== */
.kyc{border-left:7px solid var(--navy)}
.kyc-l{font-size:14px;color:var(--ink-2)}
.kyc-v{font-size:21px;font-weight:800;color:var(--navy);margin:3px 0 8px;
  display:flex;align-items:center;flex-wrap:wrap;gap:4px}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;margin-bottom:2px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;color:var(--ink-2);
  border-radius:20px;padding:9px 15px;font-size:14.5px;font-weight:600;
  font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

.prod{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  border:2px solid var(--line);box-shadow:0 2px 10px rgba(15,76,117,.05)}
.prod.warn{border-color:#EBCB94}
.prod-top{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
.prod-nm{font-size:17.5px;font-weight:700;color:var(--ink);line-height:1.4}
.prod-cash{background:var(--gold-lt);border-radius:11px;padding:10px 13px;margin:10px 0 8px;
  font-size:15px;color:#8A5510;font-weight:600}
.prod-cash b{font-size:23px;font-weight:800;color:var(--gold)}
.prod-cash.alt{background:#EEF3F6;color:var(--navy)}
.prod-d{font-size:14px;color:var(--ink-2);line-height:1.62}
.prod-meta{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.prod-meta span{background:#F2F6F8;border-radius:8px;padding:4px 9px}

/* ===== 17. AI 小幫手：對話、快捷問題、麥克風 ===== */
.chat{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
.bb{max-width:88%;padding:14px 16px;border-radius:18px;font-size:15.5px;line-height:1.68}
.bb.ai{background:var(--card);border:2px solid var(--line);border-bottom-left-radius:5px;
  align-self:flex-start;color:var(--ink)}
.bb.me{background:var(--navy);color:#fff;border-bottom-right-radius:5px;
  align-self:flex-end;font-weight:600}
.bb.typing{color:var(--ink-2);font-style:italic}
.ai-go{display:block;width:100%;margin-top:11px;background:#fff;color:var(--navy);
  border:2px solid var(--navy);border-radius:12px;padding:11px;font-size:15px;
  font-weight:700;font-family:inherit;cursor:pointer}
.alert .ai-go{margin-top:10px}

.quick{margin-bottom:14px}
.qbtn{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:15px 16px;font-size:16px;font-family:inherit;color:var(--ink);
  cursor:pointer;margin-bottom:9px;line-height:1.5}
.qbtn:hover{border-color:var(--navy)}

.mic{width:100%;border:0;border-radius:16px;padding:20px;font-size:20px;font-weight:700;
  font-family:inherit;cursor:pointer;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:12px}
.mic .mic-ic{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 26px}
.mic.on{background:var(--red)}

.disc{font-size:12.5px;color:var(--ink-2);line-height:1.7;background:#E9EEF2;
  border-radius:12px;padding:12px 14px;margin-bottom:12px}
/* 同一個揭露框裡的第二段（通用風險揭露），用細線跟上一段分開 */
.disc-x{margin-top:9px;padding-top:9px;border-top:1px solid #D5DEE5}
.spk{display:block;margin-top:10px;background:#EEF3F6;border:0;border-radius:10px;
  padding:9px 13px;font-size:14px;font-family:inherit;color:var(--navy);
  font-weight:600;cursor:pointer}

/* ===== 18. 卡片內的次要動作鈕（選方案、試算並申購、撥電話） ===== */
.pick{width:100%;margin-top:11px;background:var(--navy);color:#fff;border:0;
  border-radius:12px;padding:14px;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer}
.prod.open .pick{background:#fff;color:var(--navy);border:2px solid var(--navy)}

/* ===== 19. 申購試算面板 ===== */
.order{margin-top:14px;padding-top:15px;border-top:2px dashed var(--line)}
.ord-h{font-size:16px;font-weight:700;margin-bottom:10px}
.ord-out{display:flex;gap:10px;margin:14px 0 10px}
.ord-out>div{flex:1;background:var(--green-lt);border-radius:12px;padding:11px 13px}
.ord-out span{display:block;font-size:13px;color:var(--ink-2)}
.ord-out b{font-size:20px;color:var(--green);font-weight:800}
.ord-out .alt{flex:1;background:#EEF3F6;color:var(--navy);font-size:14px;line-height:1.6}
.ord-fee{font-size:14px;color:var(--ink-2);background:#F4F8FA;border-radius:10px;
  padding:10px 13px;margin-bottom:13px}
.ord-fee b{color:var(--navy);font-size:16px}

/* ===== 20. 二次確認浮層（防誤觸） ===== */
.sheet{position:absolute;inset:0;background:rgba(10,32,50,.55);display:none;
  align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet-box{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:22px 18px 18px;
  max-height:88%;overflow-y:auto}
.sheet-t{font-size:15px;color:var(--ink-2);text-align:center}
.sheet-big{font-size:23px;font-weight:800;color:var(--navy);text-align:center;margin:6px 0 16px;line-height:1.35}
.sheet-kv{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid #F0F4F7;font-size:15.5px;color:var(--ink-2)}
.sheet-kv b{font-size:20px;color:var(--ink);font-weight:800}
.sheet-kv.full{display:block;line-height:1.7;border-bottom:0;text-align:center;color:var(--ink)}
.sheet-kv.full.sub{font-size:14px;color:var(--ink-2);padding-top:0}

/* ==========================================================================
   app.js — 程式邏輯
   --------------------------------------------------------------------------
   一般情況下不用改這個檔案。
   要改數字 → data.js ／ 要改版型 → screens.js ／ 要改講稿 → notes.js
   ========================================================================== */

(function () {
  'use strict';

  var ROLE    = 'client';   // client | advisor
  var current = 'cash';
  var fontIdx = 0;          // 目前字級（對應 FONT_STEPS）
  var orderKey = null;      // 投資頁展開中的申購試算是哪一檔商品

  function screens() { return ROLE === 'advisor' ? SCREENS_ADVISOR : SCREENS_CLIENT; }

  /* ---------- 啟動 ---------- */
  function init() {
    buildRoles();
    bindOnce();
    paintFooter();
    paintChrome();
    render(screens()[0].id);
    registerServiceWorker();
  }

  /* 桌機版頁尾的風險揭露，跟 App 內共用 data.js 的同一份文字 */
  function paintFooter() {
    var el = document.getElementById('footDisc');
    if (el) el.textContent = GENERAL_DISCLAIMER;
  }

  /* 只綁一次的事件（元素本身不會被換掉，只換 innerHTML） */
  function bindOnce() {
    document.getElementById('roles').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (b) setRole(b.dataset.r);
    });
    document.getElementById('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (b) render(b.dataset.s);
    });
    document.getElementById('nav').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (b) render(b.dataset.s);
    });
    /* 畫面內任何 [data-go] 按鈕都能跳頁 */
    document.getElementById('body').addEventListener('click', function (e) {
      var b = e.target.closest('[data-go]');
      if (b) render(b.dataset.go);
    });
    document.getElementById('a11y').addEventListener('click', stepFont);
  }

  /* ---------- 身分切換 ---------- */
  function buildRoles() {
    document.getElementById('roles').innerHTML = ROLES.map(function (r) {
      return '<button class="role' + (r.id === ROLE ? ' on' : '') + '" data-r="' + r.id + '">' +
        r.nm + '<span>' + r.who + '</span></button>';
    }).join('');
  }

  function setRole(r) {
    if (r === ROLE) return;
    ROLE = r;
    setActive('#roles .role', r, 'r');
    paintChrome();
    render(screens()[0].id);
  }

  /* 重繪頁籤、底部導覽、問候語 */
  function paintChrome() {
    document.getElementById('greet').textContent =
      (ROLE === 'advisor' ? ADVISOR.name : CONFIG.userName) + '，早安';

    document.getElementById('tabs').innerHTML = screens().map(function (s) {
      return '<button class="tab" data-s="' + s.id + '">' + s.tab + '</button>';
    }).join('');

    document.getElementById('nav').innerHTML = screens().map(function (s) {
      return '<button data-s="' + s.id + '">' +
        '<svg viewBox="0 0 24 24">' + NAV_ICONS[s.id] + '</svg>' + s.nav + '</button>';
    }).join('');
  }

  /* ---------- 切換並繪製畫面 ---------- */
  function render(key) {
    if (!S[key]) return;
    current = key;
    closeSheet();

    var meta = screens().filter(function (s) { return s.id === key; })[0];
    if (!meta) return;
    document.getElementById('scr-title').textContent = meta.title;

    var body = document.getElementById('body');
    body.innerHTML = S[key]();
    body.scrollTop = 0;

    setActive('#tabs .tab', key, 's');
    setActive('#nav button', key, 's');
    renderNotes(key);

    if (key === 'cash')      initCalendar();
    if (key === 'pension')   initPension();
    if (key === 'calc')      initCalc();
    if (key === 'invest')    initInvest();
    if (key === 'ai')        initAI();
    if (key === 'advToday')  initAdvToday();
    if (key === 'advList')   initAdvList();
  }

  function setActive(sel, key, attr) {
    document.querySelectorAll(sel).forEach(function (el) {
      el.classList.toggle('on', el.dataset[attr] === key);
    });
  }

  /* ---------- 右側講稿 ---------- */
  function renderNotes(key) {
    var N = NOTES[key];
    if (!N) return;
    document.getElementById('notes').innerHTML =
      '<div class="kicker">' + N.k + '</div>' +
      '<h2>' + N.h + '</h2>' +
      '<p class="lead">' + N.lead + '</p>' +
      N.n.map(function (x) {
        return '<div class="note ' + x[2] + '"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>';
      }).join('');
  }

  /* ======================================================================
     無障礙：字級三段切換
     ====================================================================== */
  function stepFont() {
    fontIdx = (fontIdx + 1) % FONT_STEPS.length;
    var f = FONT_STEPS[fontIdx];
    ['body', 'nav'].forEach(function (id) {
      document.getElementById(id).style.zoom = f.z;
    });
    document.getElementById('a11yTx').textContent = f.k;
  }

  /* ---------- 共用小工具 ---------- */
  function paintTrack(sl) {
    var p = (sl.value - sl.min) / (sl.max - sl.min) * 100;
    sl.style.background = 'linear-gradient(90deg,var(--teal) 0%,var(--teal) ' + p +
                          '%,#DCE6EC ' + p + '%,#DCE6EC 100%)';
  }

  /* 把「元」換算成「X 萬」 */
  function wan(v) { return Math.round(v / 10000).toLocaleString() + ' 萬'; }
  function nt(v)  { return 'NT$ ' + Math.round(v).toLocaleString(); }

  /* ======================================================================
     畫面 ①：現金流月曆（含 PLAN 模擬）
     ====================================================================== */
  function initCalendar() {
    var cal = document.getElementById('cal');
    if (!cal) return;

    var off = document.getElementById('planOff');
    if (off) off.addEventListener('click', function () { PLAN = null; render('cash'); });

    /* 自動計算當月 1 號是星期幾、當月共幾天 */
    var firstDay    = new Date(CONFIG.year, CONFIG.month - 1, 1).getDay();
    var daysInMonth = new Date(CONFIG.year, CONFIG.month, 0).getDate();

    var html = ['日','一','二','三','四','五','六'].map(function (d) {
      return '<div class="dow">' + d + '</div>';
    }).join('');

    for (var i = 0; i < firstDay; i++) html += '<div class="day blank"></div>';

    for (var d = 1; d <= daysInMonth; d++) {
      var isPay  = !!PAYS[d];
      var isPlan = !!PLAN && PLAN.day === d;
      var cls    = isPlan ? ' pay plan' : (isPay ? ' pay' : '');
      html += '<div class="day' + cls + '" data-d="' + d + '">' +
              d + (isPay || isPlan ? '<span class="dot"></span>' : '') + '</div>';
    }
    cal.innerHTML = html;

    cal.querySelectorAll('.day.pay').forEach(function (el) {
      el.addEventListener('click', function () { showPay(+el.dataset.d); });
    });
    showPay(0);
  }

  function showPay(day) {
    document.querySelectorAll('.day.pay').forEach(function (e) {
      e.classList.toggle('sel', +e.dataset.d === day);
    });

    var box = document.getElementById('paylist');
    if (!box) return;

    /* 點到模擬方案那一天 */
    if (PLAN && day === PLAN.day) {
      box.innerHTML =
        '<div class="list-title">' + CONFIG.month + ' 月 ' + day + ' 日 入帳（模擬）</div>' +
        '<div class="pay-row sim"><div><span class="n">' + PLAN.nm + '</span>' +
        '<div class="d">' + PLAN.freq + '</div></div>' +
        '<span class="v">+' + PLAN.add.toLocaleString() + '</span></div>' +
        '<button class="bigbtn o sm" id="backAll">← 看本月全部</button>';
      bindBack();
      return;
    }

    if (!day) {
      var rows = '';
      Object.keys(PAYS).forEach(function (k) {
        PAYS[k].forEach(function (p) {
          rows += '<div class="pay-row"><div><span class="n">' + p.n + '</span>' +
                  '<div class="d">' + CONFIG.month + ' 月 ' + k + ' 日</div></div>' +
                  '<span class="v">+' + p.v.toLocaleString() + '</span></div>';
        });
      });
      if (PLAN) {
        rows += '<div class="pay-row sim"><div><span class="n">' + PLAN.nm + '（模擬）</span>' +
                '<div class="d">' + CONFIG.month + ' 月 ' + PLAN.day + ' 日　' + PLAN.freq + '</div></div>' +
                '<span class="v">+' + PLAN.add.toLocaleString() + '</span></div>';
      }
      box.innerHTML =
        '<div class="list-title">本月入帳明細（點月曆金點看細節）</div>' + rows +
        '<div class="pay-row pay-total"><span class="n">合計</span>' +
        '<span class="v">+' + (TOTAL + (PLAN ? PLAN.add : 0)).toLocaleString() + '</span></div>';
    } else {
      box.innerHTML =
        '<div class="list-title">' + CONFIG.month + ' 月 ' + day + ' 日 入帳</div>' +
        PAYS[day].map(function (p) {
          return '<div class="pay-row"><div><span class="n">' + p.n + '</span>' +
                 '<div class="d">' + p.d + '</div></div>' +
                 '<span class="v">+' + p.v.toLocaleString() + '</span></div>';
        }).join('') +
        '<button class="bigbtn o sm" id="backAll">← 看本月全部</button>';
      bindBack();
    }
  }

  function bindBack() {
    var back = document.getElementById('backAll');
    if (back) back.addEventListener('click', function () { showPay(0); });
  }

  /* ======================================================================
     畫面 ②：我的月退俸 —— 把缺口換算成本金，再配對可承作的商品
     ====================================================================== */
  function initPension() {
    var sl = document.getElementById('tgt');
    if (!sl) return;
    sl.addEventListener('input', function () { pension(+sl.value); paintTrack(sl); });
    paintTrack(sl);
    pension(+sl.value);

    document.getElementById('solbox').addEventListener('click', function (e) {
      var b = e.target.closest('[data-plan]');
      if (b) choosePlan(b.dataset.plan, +sl.value);
    });
  }

  function pension(target) {
    document.getElementById('tgtVal').textContent = 'NT$ ' + target.toLocaleString();

    var gap = target - TOTAL;
    var box = document.getElementById('gapbox');
    var sol = document.getElementById('solbox');

    /* 已達標：不製造假需求，改推「把多出來的錢鎖成終身給付」 */
    if (gap <= 0) {
      box.className = 'result';
      box.innerHTML =
        '<div class="lbl">您目前的月現金流</div>' +
        '<div class="big">已達標</div>' +
        '<div class="tip">每月入帳 NT$ ' + TOTAL.toLocaleString() +
        '，比目標多 <b>' + (-gap).toLocaleString() + ' 元</b>。' +
        '多出來的部分可以規劃旅遊、孫子的教育金，或轉入年金險鎖住終身給付。</div>';
      sol.innerHTML = '<button class="bigbtn o" data-go="invest">看看有什麼可以放的商品</button>';
      return;
    }

    box.className = 'result warn';
    box.innerHTML =
      '<div class="lbl">距離每月 ' + target.toLocaleString() + ' 元，還差</div>' +
      '<div class="big">' + gap.toLocaleString() + ' 元</div>' +
      '<div class="tip">一年就是 <b>' + (gap * 12).toLocaleString() +
      ' 元</b>。下面三個方法都可以把這個缺口補起來。</div>';

    sol.innerHTML =
      '<div class="sec-h">補足缺口的三個方法</div>' +
      SOLUTIONS.map(function (s) {
        var need   = Math.round(gap * 12 / s.y);        // 需投入本金
        var per100 = Math.round(1000000 * s.y / 12);    // 每 100 萬每月可領
        var fit    = s.rr <= CONFIG.maxRR;
        return '<div class="sol s-' + s.k + '">' +
          '<div class="sol-top">' +
            '<span class="sol-tag">' + s.tag + '</span>' +
            '<span class="pill rr' + s.rr + '">RR' + s.rr + '</span>' +
          '</div>' +
          '<div class="sol-nm">' + s.nm + '</div>' +
          '<div class="sol-cat">' + s.cat + '</div>' +
          '<div class="sol-need"><span>需投入本金</span><b>' + wan(need) + '</b></div>' +
          '<div class="sol-d">年配息約 ' + (s.y * 100).toFixed(1) + '%　·　每 100 萬每月約領 ' +
            per100.toLocaleString() + ' 元</div>' +
          '<div class="sol-d">' + s.d + '</div>' +
          '<div class="sol-fit ' + (fit ? 'ok' : 'no') + '">' +
            (fit ? '✓ 符合您的' + CONFIG.riskProfile + '風險屬性'
                 : '⚠ 超過您的風險屬性，65 歲以上須完成加強版適合度評估') +
          '</div>' +
          '<button class="pick" data-plan="' + s.k + '">選這個 → 看月曆會變怎樣</button>' +
        '</div>';
      }).join('') +
      '<button class="bigbtn p" data-go="invest">看完整商品清單</button>' +
      '<button class="bigbtn o">請營業員幫我試算</button>';
  }

  /* 選定方案 → 寫入 PLAN → 跳回月曆看「補完之後長什麼樣」 */
  function choosePlan(k, target) {
    var s   = SOLUTIONS.filter(function (x) { return x.k === k; })[0];
    var gap = target - TOTAL;
    if (!s || gap <= 0) return;
    var need = Math.round(gap * 12 / s.y);
    PLAN = {
      k: s.k, nm: s.nm, cat: s.cat, day: s.day, freq: s.freq,
      add: gap, need: need, needTx: wan(need), target: target
    };
    render('cash');
  }

  /* ======================================================================
     畫面 ③：老本撐多久試算
     ====================================================================== */
  function initCalc() {
    var sl = document.getElementById('exp');
    if (!sl) return;
    sl.addEventListener('input', function () { calc(+sl.value); paintTrack(sl); });
    paintTrack(sl);
    calc(+sl.value);
  }

  /**
   * 逐月模擬資產耗損
   * 每月：餘額 × (1+月報酬) + 被動收入 − 開銷；開銷隨通膨遞增
   */
  function calc(expense) {
    document.getElementById('expVal').textContent = 'NT$ ' + expense.toLocaleString();

    var bal  = CONFIG.totalAssets;
    var age  = CONFIG.currentAge;
    var exp  = expense;
    var inc  = TOTAL;
    var rM   = Math.pow(1 + CONFIG.annualReturn, 1 / 12) - 1;
    var infM = Math.pow(1 + CONFIG.inflation, 1 / 12) - 1;
    var months = 0;
    var CAP = 111;

    while (bal > 0 && age < CAP) {
      bal = bal * (1 + rM) + inc - exp;
      exp *= (1 + infM);
      months++;
      if (months % 12 === 0) age++;
    }

    var safe = age >= CAP;
    var res  = document.getElementById('res');

    document.getElementById('resAge').textContent = safe ? '100 歲以上' : age + ' 歲';

    var pct = Math.max(6, Math.min(100,
      (Math.min(age, 105) - CONFIG.currentAge) / (105 - CONFIG.currentAge) * 100));
    document.getElementById('resFill').style.width = pct + '%';

    res.className = 'result' + (safe || age >= 90 ? '' : (age >= 82 ? ' warn' : ' bad'));

    document.getElementById('resTip').innerHTML =
      (safe || age >= 90) ? '很安全，還有餘裕可以規劃旅遊或給孫子的教育金。'
      : (age >= 82)       ? '大致足夠，但建議提高每月配息收入，減緩動用本金的速度。'
                          : '資產可能提早用完。<b>建議與康和營業員討論調整方案。</b>';
  }

  /* ======================================================================
     畫面 ④：投資商品（含申購試算與二次確認）
     ====================================================================== */
  function initInvest() {
    var chips = document.getElementById('chips');
    if (!chips) return;

    chips.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      chips.querySelectorAll('button').forEach(function (x) {
        x.classList.toggle('on', x === b);
      });
      orderKey = null;
      paintProducts(b.dataset.c);
    });

    document.getElementById('prodbox').addEventListener('click', function (e) {
      var t = e.target.closest('[data-try]');
      if (t) {
        orderKey = (orderKey === t.dataset.try) ? null : t.dataset.try;
        paintProducts(document.querySelector('#chips .on').dataset.c);
        return;
      }
      if (e.target.closest('#ordNext')) openConfirm();
    });

    paintProducts('all');
  }

  function paintProducts(cat) {
    var box  = document.getElementById('prodbox');
    var list = (cat === 'all') ? PRODUCTS : PRODUCTS.filter(function (p) { return p.c === cat; });

    var lastCat = '';
    box.innerHTML = list.map(function (p) {
      var head = '';
      if (p.c !== lastCat) { head = '<div class="sec-h">' + CAT_NAMES[p.c] + '</div>'; lastCat = p.c; }

      var fit    = p.rr <= CONFIG.maxRR;
      var per100 = p.y ? Math.round(1000000 * p.y / 12) : 0;
      var open   = orderKey === p.nm;

      return head +
        '<div class="prod' + (p.warn ? ' warn' : '') + (open ? ' open' : '') + '">' +
          '<div class="prod-top">' +
            '<div class="prod-nm">' + p.nm + '</div>' +
            '<span class="pill rr' + p.rr + '">RR' + p.rr + '</span>' +
          '</div>' +
          (per100
            ? '<div class="prod-cash">每投入 100 萬　每月約領 <b>' + per100.toLocaleString() + '</b> 元</div>'
            : '<div class="prod-cash alt">' + p.pay + '　·　保障型商品，不以配息計算</div>') +
          '<div class="prod-d">' + p.d + '</div>' +
          '<div class="prod-meta"><span>最低 ' + p.min + '</span><span>' + p.pay + '</span></div>' +
          '<div class="sol-fit ' + (fit ? 'ok' : 'no') + '">' +
            (fit ? '✓ 適合您（' + CONFIG.riskProfile + '）' : '⚠ 需加強評估後方可承作') +
          '</div>' +
          '<button class="pick" data-try="' + p.nm + '">' +
            (open ? '收起試算' : '試算並申購') + '</button>' +
          (open ? orderPanel(p) : '') +
        '</div>';
    }).join('');

    if (!list.length) {
      box.innerHTML = '<div class="card"><div class="sub">此分類尚無示意商品。</div></div>';
    }
    if (orderKey) initOrder();
  }

  /* 申購試算面板 */
  function orderPanel(p) {
    return '<div class="order">' +
      '<div class="ord-h">我要投入多少？</div>' +
      '<div class="slider-val" id="ordVal">' + nt(ORDER.def) + '</div>' +
      '<input type="range" id="ordSl" min="' + ORDER.min + '" max="' + ORDER.max +
        '" step="' + ORDER.step + '" value="' + ORDER.def + '" data-p="' + p.nm + '">' +
      '<div class="range-ends"><span>' + (ORDER.min / 10000) + ' 萬</span>' +
        '<span>' + (ORDER.max / 10000) + ' 萬</span></div>' +
      '<div class="ord-out" id="ordOut"></div>' +
      '<div class="ord-fee" id="ordFee"></div>' +
      '<button class="bigbtn p" id="ordNext">下一步</button>' +
    '</div>';
  }

  function initOrder() {
    var sl = document.getElementById('ordSl');
    if (!sl) return;
    sl.addEventListener('input', function () { order(+sl.value); paintTrack(sl); });
    paintTrack(sl);
    order(+sl.value);
  }

  function curProduct() {
    return PRODUCTS.filter(function (p) { return p.nm === orderKey; })[0];
  }

  function order(amt) {
    var p = curProduct();
    if (!p) return;
    var fee = CAT_FEE[p.c];

    document.getElementById('ordVal').textContent = nt(amt);
    document.getElementById('ordOut').innerHTML = p.y
      ? '<div><span>每月約領</span><b>' + nt(amt * p.y / 12) + '</b></div>' +
        '<div><span>一年約領</span><b>' + nt(amt * p.y) + '</b></div>'
      : '<div class="alt">保障型商品，給付方式依契約條款，不以配息計算。</div>';
    document.getElementById('ordFee').innerHTML =
      '費用：' + fee.tx + (fee.rate ? '　約 <b>' + nt(amt * fee.rate) + '</b>' : '');
  }

  /* ---------- 二次確認（防誤觸） ---------- */
  function openConfirm() {
    var p   = curProduct();
    var amt = +document.getElementById('ordSl').value;
    var fee = CAT_FEE[p.c];
    var fit = p.rr <= CONFIG.maxRR;

    showSheet(
      '<div class="sheet-t">請再確認一次</div>' +
      '<div class="sheet-big">' + p.nm + '</div>' +
      '<div class="sheet-kv"><span>投入金額</span><b>' + nt(amt) + '</b></div>' +
      (p.y ? '<div class="sheet-kv"><span>每月約領</span><b>' + nt(amt * p.y / 12) + '</b></div>' : '') +
      '<div class="sheet-kv"><span>費用</span><b>' +
        (fee.rate ? nt(amt * fee.rate) : '內含') + '</b></div>' +
      '<div class="sheet-warn">⚠ 本商品風險等級 RR' + p.rr + '，' +
        (fit ? '符合您的' + CONFIG.riskProfile + '風險屬性。'
             : '<b>超過您的風險屬性</b>，須由營業員完成高齡客戶加強版適合度評估後方可承作。') +
        '<br>投資均有風險，配息可能來自本金，本金可能虧損。</div>' +
      '<button class="bigbtn p" id="ordOk">確認送出</button>' +
      '<button class="bigbtn o" id="ordCancel">再想一下</button>'
    );

    document.getElementById('ordOk').addEventListener('click', orderDone);
    document.getElementById('ordCancel').addEventListener('click', closeSheet);
  }

  function orderDone() {
    var p = curProduct();
    showSheet(
      '<div class="ok-ic">✓</div>' +
      '<div class="sheet-big">已送出申購指示</div>' +
      '<div class="sheet-kv full">' + ADVISOR.name + '將於 1 小時內與您電話確認，' +
        '確認後才會正式扣款。您隨時可以反悔。</div>' +
      '<div class="sheet-kv full sub">商品：' + p.nm + '</div>' +
      '<button class="bigbtn p" id="ordDone">知道了</button>'
    );
    document.getElementById('ordDone').addEventListener('click', function () {
      closeSheet();
      orderKey = null;
      paintProducts(document.querySelector('#chips .on').dataset.c);
    });
  }

  function showSheet(html) {
    var s = document.getElementById('sheet');
    s.innerHTML = '<div class="sheet-box">' + html + '</div>';
    s.classList.add('on');
  }

  function closeSheet() {
    var s = document.getElementById('sheet');
    if (s) { s.classList.remove('on'); s.innerHTML = ''; }
  }

  /* ======================================================================
     畫面 ⑤：AI 小幫手（含語音輸入與朗讀）
     ====================================================================== */
  function initAI() {
    var quick = document.getElementById('quick');
    if (!quick) return;

    quick.addEventListener('click', function (e) {
      var b = e.target.closest('.qbtn');
      if (b) ask(b.dataset.q);
    });

    document.getElementById('chat').addEventListener('click', function (e) {
      var b = e.target.closest('.spk');
      if (b) speak(b.parentNode.dataset.say);
    });

    document.getElementById('mic').addEventListener('click', startVoice);
  }

  /**
   * key     用來查 AI_ANSWERS 的題目
   * display 泡泡上要顯示的文字（語音輸入時是使用者實際說的話）
   */
  function ask(key, display) {
    var chat = document.getElementById('chat');
    if (!chat) return;

    chat.insertAdjacentHTML('beforeend', '<div class="bb me">' + (display || key) + '</div>');
    chat.insertAdjacentHTML('beforeend', '<div class="bb ai typing">小幫手正在查…</div>');

    /* 把「問題」捲到最上方，回答就會完整出現在它下面 */
    var asked = chat.lastElementChild.previousElementSibling;
    scrollToEl(asked);

    setTimeout(function () {
      var t = chat.querySelector('.typing');
      if (!t) return;
      t.classList.remove('typing');
      t.innerHTML = AI_ANSWERS[key] ||
        '這個問題我還在學。要不要先<button class="ai-go" data-go="invest">看看商品清單</button>，' +
        '或直接請' + ADVISOR.name + '為您說明？';
      t.dataset.say = t.textContent;
      t.insertAdjacentHTML('beforeend', '<button class="spk">🔊 念給我聽</button>');
      scrollToEl(asked);
    }, 700);
  }

  /* 捲動手機內容區，讓指定元素出現在頂端 */
  function scrollToEl(el) {
    var body = document.getElementById('body');
    var d = el.getBoundingClientRect().top - body.getBoundingClientRect().top;
    body.scrollTop += d - 14;
  }

  /* ---------- 語音輸入：優先用瀏覽器原生辨識，不支援時退回模擬 ---------- */
  var voiceIdx = 0;

  function startVoice() {
    var mic = document.getElementById('mic');
    if (mic.classList.contains('on')) return;

    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR || location.protocol === 'file:') { simulateVoice(); return; }

    var r = new SR();
    r.lang = 'zh-TW';
    r.interimResults = false;
    r.maxAlternatives = 1;

    var got = false;
    micOn(true, '聆聽中…請說話');

    r.onresult = function (e) {
      got = true;
      var said = e.results[0][0].transcript;
      micOn(false);
      ask(matchVoice(said), said);
    };
    r.onerror = function () { micOn(false); if (!got) simulateVoice(); };
    r.onend   = function () { micOn(false); };

    try { r.start(); } catch (err) { micOn(false); simulateVoice(); }
  }

  /* 沒有語音辨識（或用 file:// 開啟）時，依序問下一個常見問題 */
  function simulateVoice() {
    micOn(true, '聆聽中…');
    setTimeout(function () {
      micOn(false);
      ask(AI_QUICK[voiceIdx % AI_QUICK.length]);
      voiceIdx++;
    }, 900);
  }

  function micOn(on, tx) {
    var mic = document.getElementById('mic');
    if (!mic) return;
    mic.classList.toggle('on', on);
    document.getElementById('micTx').textContent = on ? (tx || '聆聽中…') : '按住說話';
  }

  /* 聽到的話裡有哪個關鍵字，就對應到哪一題 */
  function matchVoice(said) {
    for (var i = 0; i < VOICE_MATCH.length; i++) {
      for (var j = 0; j < VOICE_MATCH[i].kw.length; j++) {
        if (said.indexOf(VOICE_MATCH[i].kw[j]) >= 0) return VOICE_MATCH[i].q;
      }
    }
    return said;   // 沒對上就原文送進去，會走預設回覆
  }

  /* ---------- 朗讀回答 ---------- */
  function speak(text) {
    if (!text || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.replace('🔊 念給我聽', ''));
    u.lang = 'zh-TW';
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }

  /* ======================================================================
     營業員視角
     ====================================================================== */
  function initAdvToday() {
    var withGap = CLIENTS.filter(function (c) { return c.gap > 0; })
                         .sort(function (a, b) { return b.gap - a.gap; });

    var totalGap = withGap.reduce(function (s, c) { return s + c.gap; }, 0);
    var scale    = totalGap * 12 / ADV_CONV.yield;      // 可承接規模
    var fee      = scale * ADV_CONV.feeRate;            // 預估手續費

    document.getElementById('advHero').innerHTML =
      '<div class="lbl">本月可轉換缺口（' + withGap.length + ' 位客戶）</div>' +
      '<div class="amt"><small>NT$</small>' + wan(scale) + '</div>' +
      '<div class="note">預估手續費收入 ' + nt(fee) + '　·　合計缺口 ' +
        totalGap.toLocaleString() + ' 元／月</div>';

    document.getElementById('advTodo').innerHTML = withGap.map(function (c) {
      var need = c.gap * 12 / ADV_CONV.yield;
      return '<div class="todo">' +
        '<div class="todo-top"><b>' + c.nm + '</b>' +
          '<span class="pill hot' + c.hot + '">缺口 ' + c.gap.toLocaleString() + '／月</span></div>' +
        '<div class="todo-x">可承接 <b>' + wan(need) + '</b>　·　預估手續費 ' +
          nt(need * ADV_CONV.feeRate) + '</div>' +
        '<div class="todo-sig">' + c.sig + '　<i>' + c.when + '</i></div>' +
        '<button class="pick">撥電話</button>' +
      '</div>';
    }).join('');
  }

  function initAdvList() {
    var sorted = CLIENTS.slice().sort(function (a, b) {
      return (b.hot - a.hot) || (b.gap - a.gap);
    });
    var hotTx = { 3:'熱度高', 2:'熱度中', 1:'熱度低' };

    document.getElementById('advClients').innerHTML = sorted.map(function (c) {
      return '<div class="cl' + (c.nm === '陳伯伯' ? ' me' : '') + '">' +
        '<div class="cl-head">' +
          '<div class="avatar">' + c.nm.charAt(0) + '</div>' +
          '<div><div class="cl-nm">' + c.nm + '</div>' +
          '<div class="cl-sub">' + c.age + ' 歲　·　' + c.rr + '　·　AUM ' + wan(c.aum) + '</div></div>' +
          '<span class="pill hot' + c.hot + '">' + hotTx[c.hot] + '</span>' +
        '</div>' +
        '<div class="cl-sig">' + c.sig + '　<i>' + c.when + '</i></div>' +
        '<div class="cl-gap">' +
          (c.gap ? '每月缺口 <b>' + c.gap.toLocaleString() + ' 元</b>　→　可承接 ' +
                   wan(c.gap * 12 / ADV_CONV.yield)
                 : '月退俸已達標，適合談年金險與傳承規劃') +
        '</div>' +
        (c.nm === '陳伯伯' ? '<button class="pick" data-go="advClient">看詳情</button>' : '') +
      '</div>';
    }).join('');
  }

  /* ---------- PWA Service Worker ----------
     只有透過 http/https 開啟時才註冊（雙擊本機檔案時會自動略過，不會報錯） */
  function registerServiceWorker() {
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('service-worker.js').catch(function () { /* 忽略 */ });
    }
  }

  /* ---------- 開始 ---------- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
